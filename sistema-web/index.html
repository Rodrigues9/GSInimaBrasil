      { name: 'Poço São João', vol: 1064, vaz: 44.0, h: 24.0, cl: 1.10, fl: 0.92, op: 'Ana', time: '07:31' },

      bg: st.period === x[0] ? '#0A2E5C' : 'transparent', fg: st.period === x[0] ? '#FFFFFF' : '#0A2E5C',
      pick: () => this.setState({ period: x[0] })

      },
      readout: st.hover >= 0 ? day(st.hover) + ': ' + unitTxt(sp, sp.s[st.hover]) : 'Passe o mouse ou toque numa barra para ver o dia'
    };

      ['Rua Tibiriçá, 1100', 'Vila Moraes', 'eta', 39, 2340, 4, 240],

      ['Rua Minas Gerais, 1500', 'Parque Minas Gerais', 'eta', 33, 1250, 3, 110],

      ['Rua dos Ipês, 400', 'Jardim São João', 'sj', 30, 920, 3, 95],

    ];

      pick: () => {

      const names = L[k];
      const nOn = names.filter((n) => b.units[n]).length;
      const setAll = (v) => () => { const pm = clone(); names.forEach((n) => { pm[u.id][k].units[n] = v; }); put(pm); };
      return {
        title: TITLES[k], on: b.on, unitLabel: (k === 'coleta' || k === 'descarga') ? 'Sistemas visíveis' : 'Unidades visíveis',
        summary: b.on ? nOn + ' de ' + names.length + ((k === 'coleta' || k === 'descarga') ? ' sistemas liberados' : ' unidades liberadas') : 'Bloco oculto no app desta pessoa',
        span: k === 'poco' ? '1 / -1' : 'auto',
        bd: b.on ? '#0057A8' : '#DDE5EE', bg: b.on ? '#FFFFFF' : '#F5F8FB',
        toggle: () => { const pm = clone(); pm[u.id][k].on = !pm[u.id][k].on; put(pm); },
        all: setAll(true), none: setAll(false),

      { label: 'Painel de operação', desc: 'Dashboards e relatórios', acts: [act('painelVer', 'Ver'), act('painelExp', 'Exportar relatórios')] },
      { label: 'Importar e exportar', desc: 'Planilhas CSV e XLSX', acts: [act('imp', 'Importar'), act('exp', 'Exportar')] },
      { label: 'Administração', desc: 'Usuários, permissões e unidades', acts: [act('admin', 'Gerenciar')] }
    ];

      sb: {
        open: st.open, closed: !st.open, w: st.open ? 252 : 84, px: st.open ? 16 : 14,
        just: st.open ? 'flex-start' : 'center',
        label: st.open ? 'Recolher menu' : 'Expandir menu',

        toggleActive: () => this.setState({ users: st.users.map((x) => x.id === u.id ? Object.assign({}, x, { active: !u.active }) : x), saved: false })
      },
      save: () => this.setState({ saved: true }),
      saveLabel: st.saved ? 'Alterações salvas' : 'Salvar alterações'
    };
  }
}

e=\"font-size: 13px; color: #52627A\">{{ d.span }}, por {{ d.who }}<\/span>\n        <\/span>\n        <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; color: #0A2E5C; white-space: nowrap; font-variant-numeric: tabular-nums\">\u2248 {{ d.vol }} m\u00b3<\/span>\n      <\/div>\n    <\/sc-for>\n    <sc-if value=\"{{ ds.todayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin: 0; color: #52627A; padding: 4px\">Nenhuma descarga encerrada hoje.<\/p>\n    <\/sc-if>\n    <p style=\"margin: 4px 4px 0; font-size: 13px; color: #52627A\">O volume \u00e9 estimado pela vaz\u00e3o cadastrada de cada ponto multiplicada pela dura\u00e7\u00e3o da descarga.<\/p>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ============ NOVA DESCARGA ============ -->\n<sc-if value=\"{{ s.descargaNova }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column\">\n  <div style=\"background: #FFFFFF; padding: 14px 16px 14px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #DDE5EE\">\n    <button type=\"button\" aria-label=\"Voltar\" onClick=\"{{ nav.descarga }}\" style=\"width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0A2E5C; cursor: pointer\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n    <div style=\"display: flex; flex-direction: column\">\n      <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; color: #0A2E5C\">Nova descarga<\/span>\n      <span style=\"font-size: 13px; color: #52627A\">Ponto de descarga e hor\u00e1rios<\/span>\n    <\/div>\n  <\/div>\n  <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 16px 16px 28px; display: flex; flex-directi lex; gap: 12px; align-items: flex-start; background: #F2F7FD; border: 1.5px solid #0057A8; border-radius: 16px; padding: 14px\">\n          <span style=\"width: 40px; height: 40px; border-radius: 12px; background: #0057A8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/><\/svg><\/span>\n          <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0\">\n            <span style=\"font-weight: 700; color: #0A2E5C\">{{ ds.cn.addr }}<\/span>\n            <span style=\"font-size: 13px; color: #52627A\">{{ ds.cn.sub }}<\/span>\n            <sc-if value=\"{{ ds.cn.hasDist }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #0B6B57; font-weight: 700\">Voc\u00ea est\u00e1 a {{ ds.cn.dist }} m deste ponto<\/span><\/sc-if>\n          <\/span>\n          <button type=\"button\" onClick=\"{{ ds.cn.clear }}\" style=\"border: 0; background: transparent; color: #0057A8; font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px\">Trocar<\/button>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n\n    <div style=\"background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n      <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; color: #0A2E5C\">Hor\u00e1rios<\/span>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n          <label for=\"ds-ini\" style=\"font-weight: 700; font-size: 14px; color: #0F1E2E\">In\u00edcio<\/label>\n          <input id=\"ds-ini\" type=\"time\" value=\"{{ ds.cn.ini }}\" onChange=\"{{ ds.cn.setIni }}\" style=\"height: 54px; border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 0 12px; font-size: 20px; font-weight: 700; background: #F8FAFC; min-width: 0; font-variant-numeric: tabular-nums\" />\n          <button type=\"button\" onClick=\"{{ ds.cn.iniNow }}\" style=\"height: 38px; border: 1.5px solid #C7D4E2; border-radius: 12px; background: #FFFFFF; color: #0057A8; font-weight: 700; font-size: 14px; cursor: pointer\">Usar hora atual<\/button>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n          <label for=\"ds-fim\" style=\"font-weight: 700; font-size: 14px; color: #0F1E2E\">Fim<\/label>\n          <input id=\"ds-fim\" type=\"time\" value=\"{{ ds.cn.fim }}\" onChange=\"{{ ds.cn.setFim }}\" style=\"height: 54px; border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 0 12px; font-size: 20px; font-weight: 700; background: #F8FAFC; min-width: 0; font-variant-numeric: tabular-nums\" />\n          <button type=\"button\" onClick=\"{{ ds.cn.fimNow }}\" style=\"height: 38px; border: 1.5px solid #C7D4E2; border-radius: 12px; background: #FFFFFF; color: #0057A8; font-weight: 700; font-size: 14px; cursor: pointer\">Usar hora atual<\/button>\n        <\/div>\n      <\/div>\n      <sc-if value=\"{{ ds.cn.hasDur }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #0A2E5C; color: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-end\">\n          <span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 13px; color: #C9D8EA\">Dura\u00e7\u00e3o<\/span><span style=\"font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px\">{{ ds.cn.dur }}<\/span><\/span>\n          <span style=\"display: flex; flex-direction: column; align-items: flex-end\"><span style=\"font-size: 13px; color: #C9D8EA\">Volume estimado<\/span><span style=\"     const cnReset = { loc: -1, gps: 'idle', q: '', cl: '', obs: '', dist: 0 };

    // ---- metas
    const wait = {}; SYS.forEach((s) => { wait[s.k] = 0; });
    st.colPend.forEach((c) => { wait[A[c.a].sys] += 1; });
    let tMeta = 0, tDone = 0, tWait = 0;
    const metas = SYS.map((s) => {
      const d = st.colDone[s.k], w = wait[s.k], falta = Math.max(0, s.meta - d);
      tMeta += s.meta; tDone += d; tWait += w;
      const pctD = Math.min(100, d / s.meta * 100);
      return {
        name: s.name, txt: d + ' de ' + s.meta,
        pctD: pctD.toFixed(1), pctW: Math.min(100 - pctD, w / s.meta * 100).toFixed(1),
        sub: falta === 0 ? 'Meta do mês concluída' : 'Faltam ' + falta + (w ? ', ' + w + (w === 1 ? ' aguardando análises' : ' aguardando análises') : ''),
        subC: falta === 0 ? '#0B6B57' : '#52627A'
      };
    });
    const tPctD = Math.min(100, tDone / tMeta * 100);

    // ---- pendentes
    const pend = st.colPend.map((c) => {
      const ad = A[c.a], n = nFilled(c);
      return {
        addr: ad.addr, where: ad.bairro + ', ' + sysOf(ad.sys).name,
        when: 'Coletada em ' + c.date + ' às ' + c.time + ', por ' + c.who,
        cl: c.cl, prog: n === 0 ? 'Faltam as 6 análises' : n + ' de 6 lançadas',
        chipBg: n === 0 ? '#FDF0DC' : '#E3EEF9', chipFg: n === 0 ? '#8A3C06' : '#0057A8',
        open: () => this.setState({ screen: 'coletaAn', anId: c.id, an: Object.assign({}, c), colMsg: '' })
      };
    });

    // ---- nova coleta
    const cn = st.cn;
    const putCn = (o) => this.setState({ cn: Object.assign({}, this.state.cn, o) });
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const q = norm(cn.q.trim());
    const searching = cn.loc < 0 && q.length >= 2;
    const results = !searching ? [] : A.map((x, i) => ({ x, i }))
      .filter((o) => norm(o.x.addr + ' ' + o.x.bairro).indexOf(q) >= 0).slice(0, 5)
      .map((o) => ({ addr: o.x.addr, sub: o.x.bairro + ', ' + sysOf(o.x.sys).name, pick: () => putCn({ loc: o.i, q: '', gps: 'idle', dist: 0 }) }));
    const sel = cn.loc >= 0 ? A[cn.loc] : null;
    const clV = dec(cn.cl);
    const band = !isFinite(clV) ? { txt: 'Faixa: 0,2 a 2,0 mg/L', bg: '#EEF3F7', fg: '#52627A' }
      : clV < 0.2 ? { txt: 'Abaixo da faixa', bg: '#FDF0DC', fg: '#8A3C06' }
      : clV > 2.0 ? { txt: 'Acima da faixa', bg: '#FDF0DC', fg: '#8A3C06' }
      : { txt: 'Dentro da faixa', bg: '#E2F4EE', fg: '#0B6B57' };
    const canSave = !!sel && isFinite(clV);

    // ---- análises da coleta
    const an = st.an || {};
    const putAn = (o) => this.setState({ an: Object.assign({}, this.state.an, o) });
    const anAd = an.a != null ? A[an.a] : A[0];
    const rng = (v, lo, hi, txt) => !isFinite(v) ? { txt: 'Faixa: ' + txt, bg: '#EEF3F7', fg: '#52627A' }
      : (v < lo || v > hi) ? { txt: 'Fora da faixa (' + txt + ')', bg: '#FDF0DC', fg: '#8A3C06' }
      : { txt: 'Dentro da faixa', bg: '#E2F4EE', fg: '#0B6B57' };
    const mx = (v, max, txt) => !isFinite(v) ? { txt: 'Máximo ' + txt, bg: '#EEF3F7', fg: '#52627A' }
      : v > max ? { txt: 'Acima do máximo (' + txt + ')', bg: '#FDF0DC', fg: '#8A3C06' }
      : { txt: 'Dentro do padrão', bg: '#E2F4EE', fg: '#0B6B57' };
    const NUMS = [
      { k: 'fl', lab: 'Flúor', unit: 'mg/L', ph: '0,00', chip: (v) => rng(v, 0.6, 0.8, '0,6 a 0,8 mg/L') },
      { k: 'ph', lab: 'pH', unit: 'unidades de pH', ph: '0,0', chip: (v) => rng(v, 6, 9, '6,0 a 9,0') },
      { k: 'cor', lab: 'Cor aparente', unit: 'uH', ph: '0', chip: (v) => mx(v, 15, '15 uH') },
      { k: 'tur', lab: 'Turbidez', unit: 'uT', ph: '0,0', chip: (v) => mx(v, 5, '5 uT') }
    ];
    const nums = NUMS.map((f) => ({
      id: 'an-' + f.k, lab: f.lab, unit: f.unit, ph: f.ph, val: an[f.k] || '',
      chip: f.chip(dec(an[f.k])),
      set: (ev) => putAn({ [f.k]: ev.target.value })
    }));
    const bools = [{ k: 'ct', lab: 'Coliformes totais' }, { k: 'cte', lab: 'Coliformes termotolerantes' }].map((b) => {
      const v = an[b.k];
      return {
        lab: b.lab, isA: v === 'A', isP: v === 'P',
        aBd: v === 'A' ? '#0B6B57' : '#B9D9CE', aBg: v === 'A' ? '#0B6B57' : '#FFFFFF', aFg: v === 'A' ? '#FFFFFF' : '#0B6B57',
        pBd: v === 'P' ? '#B42318' : '#E8B7B2', pBg: v === 'P' ? '#B42318' : '#FFFFFF', pFg: v === 'P' ? '#FFFFFF' : '#8C1D18',
        setA: () => putAn({ [b.k]: 'A' }), setP: () => putAn({ [b.k]: 'P' })
      };
    });
    const anN = nFilled(an);
    const txtCol = (v) => (v === 'A' ? 'Ausente' : v === 'P' ? 'Presente' : '—');

    // ---- integração com o resto do app
    base.s.coleta = scr === 'coleta';
    base.s.coletaNova = scr === 'coletaNova';
    base.s.coletaAn = scr === 'coletaAn';
    base.s.nav = base.s.nav || scr === 'coleta';
    base.nav.coleta = () => this.setState({ screen: 'coleta', colMsg: '' });
    base.nav.coletaNova = () => this.setState({ screen: 'coletaNova', cn: Object.assign({}, cnReset), colMsg: '' });
    base.acc = st.acc;
    if (st.acc.coleta) base.accChips = base.accChips.concat(['Coleta de campo']);
    base.hist = st.colHist.concat(base.hist);
    if (st.okCtx === 'coleta') {
      base.hasNext = false;
      base.backLabel = 'Voltar para Coleta de campo';
      base.on.backList = () => this.setState({ screen: 'coleta' });
    }
    const seg = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0A2E5C' : '#52627A' });
    const tp = seg(st.colTab === 'pend'), tm = seg(st.colTab === 'metas');

    return {
      col: {
        tMeta, tDone, tWait, tFalta: Math.max(0, tMeta - tDone),
        tPctD: tPctD.toFixed(1), tPctW: Math.min(100 - tPctD, tWait / tMeta * 100).toFixed(1),
        homeSub: (tMeta - tDone) + ' faltam no mês, ' + tWait + ' aguardando análises',
        tabPend: st.colTab === 'pend', tabMetas: st.colTab === 'metas',
        toPend: set({ colTab: 'pend' }), toMetas: set({ colTab: 'metas' }),
        tpBg: tp.bg, tpFg: tp.fg, tmBg: tm.bg, tmFg: tm.fg,
        hasMsg: !!st.colMsg, msg: st.colMsg,
        metas, pend, pendN: pend.length, pendEmpty: pend.length === 0,
        cn: {
          noSel: !sel, hasSel: !!sel, busy: cn.gps === 'busy',
          gpsTxt: cn.gps === 'busy' ? 'Buscando sua localização…' : 'Usar minha localização',
          useGps: () => {
            putCn({ gps: 'busy' });
            setTimeout(() => { this.setState({ cn: Object.assign({}, this.state.cn, { gps: 'ok', loc: 3, dist: 28, q: '' }) }); }, 1100);
          },
          q: cn.q, setQ: (ev) => putCn({ q: ev.target.value }),
          results, listBd: results.length ? '1px solid #DDE5EE' : '0',
          noRes: searching && results.length === 0,
          hint: cn.loc < 0 && q.length < 2,
          addr: sel ? sel.addr : '', sub: sel ? sel.bairro + ', ' + sysOf(sel.sys).name : '',
          hasDist: !!sel && cn.gps === 'ok', dist: cn.dist,
          clear: () => putCn({ loc: -1, gps: 'idle', dist: 0 }),
          cl: cn.cl, setCl: (ev) => putCn({ cl: ev.target.value }), band,
          obs: cn.obs, setObs: (ev) => putCn({ obs: ev.target.value }),
          off: !canSave, op: canSave ? 1 : 0.45,
          saveHint: !sel ? 'Escolha o ponto de coleta.' : !isFinite(clV) ? 'Informe o cloro residual livre.' : 'Data, hora e coletor são registrados ao salvar.',
          save: () => {
            if (!canSave) return;
            const id = 'c' + st.colSeq;
            const item = { id, a: cn.loc, date: new Date().toLocaleDateString('pt-BR').slice(0, 5), time: now, who: (window.DB ? DB.operador() : 'Operador'), cl: cn.cl, fl: '', ph: '', cor: '', tur: '', ct: '', cte: '' };
            this.setState({
              colPend: st.colPend.concat([item]), colSeq: st.colSeq + 1, cn: Object.assign({}, cnReset),
              colHist: [{ title: sel.addr, sub: 'Coleta de campo', time: 'Hoje, ' + now, t: now }].concat(st.colHist),
              screen: 'ok', okCtx: 'coleta',
              last: { title: 'Coleta registrada', sub: sel.addr + ', hoje às ' + now, rows: [
                { k: 'Sistema', v: sysOf(sel.sys).name },
                { k: 'Cloro livre', v: cn.cl + ' mg/L' },
                { k: 'Demais análises', v: 'Em Pendentes' }
              ] }
            });
          }
        },
        an: {
          addr: anAd.addr, where: anAd.bairro + ', ' + sysOf(anAd.sys).name,
          when: 'Coletada em ' + (an.date || '') + ' às ' + (an.time || '') + ', por ' + (an.who || ''),
          cl: an.cl || '', n: anN, nums, bools,
          off: anN < 6, op: anN < 6 ? 0.45 : 1,
          hint: anN < 6 ? 'Lance os 6 parâmetros para concluir, ou salve e termine depois.' : 'Analista, data e hora são registrados ao concluir.',
          savePartial: () => {
            this.setState({
              colPend: st.colPend.map((c) => (c.id === an.id ? Object.assign({}, an) : c)),
              screen: 'coleta', colTab: 'pend', colMsg: 'Análises salvas. A coleta continua em Pendentes.'
            });
          },
          conclude: () => {
            if (anN < 6) return;
            const done = Object.assign({}, st.colDone); done[anAd.sys] += 1;
            const alert = an.ct === 'P' || an.cte === 'P';
            const rows = [
              { k: 'Cloro livre', v: an.cl + ' mg/L' }, { k: 'Flúor', v: an.fl + ' mg/L' }, { k: 'pH', v: an.ph },
              { k: 'Cor aparente', v: an.cor + ' uH' }, { k: 'Turbidez', v: an.tur + ' uT' },
              { k: 'Coliformes totais', v: txtCol(an.ct) }, { k: 'Coliformes termotolerantes', v: txtCol(an.cte) }
            ];
            if (alert) rows.push({ k: 'Atenção', v: 'Supervisão avisada para recoleta' });
            this.setState({
              colPend: st.colPend.filter((c) => c.id !== an.id), colDone: done,
              colHist: [{ title: anAd.addr, sub: 'Análises da coleta concluídas', time: 'Hoje, ' + now, t: now }].concat(st.colHist),
              screen: 'ok', okCtx: 'coleta',
              last: { title: 'Análises concluídas', sub: anAd.addr + ', ' + sysOf(anAd.sys).name, rows }
            });
          }
        }
      }
    };
  }

  dscPoints() {
    // [endereço, bairro, sistema, DN em mm]
    return [
      ['Rua Tibiriçá, 1100', 'Vila Moraes', 'eta', 100],
      ['Rua Bahia, 300', 'Jardim Paineiras', 'eta', 75],
      ['Rua Goiás, 410', 'Jardim Anchieta', 'eta', 100],
      ['Av. Domingos Camerlingo Caló, 3100', 'Vila Margarida', 'eta', 150],
      ['Rua Espírito Santo, 900', 'Vila Kennedy', 'eta', 75],
      ['Rua Minas Gerais, 1500', 'Parque Minas Gerais', 'eta', 100],
      ['Rua dos Ipês, 400', 'Jardim São João', 'sj', 75],
      ['Rua Flamboyant, 620', 'Vila São João', 'sj', 50],
      ['Alameda dos Lírios, 520', 'Residencial Moradas', 'mor', 75],
      ['Rua das Hortênsias, 210', 'Moradas Clube', 'mor', 50],
      ['Rua Alagoas, 300', 'Jardim Pacaembu', 'pac', 75],
      ['Rua Sergipe, 45', 'Jardim Pacaembu', 'pac', 50]
    ];
  }

  dscClock(offsetMin) {
    const d = new Date(Date.now() + (offsetMin || 0) * 60000);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  descInit() {
    return {
      dscMonthN: 38, dscMonthVol: 1880, dscSeq: 10,
      dscRun: [{ id: 'd1', p: 2, ini: this.dscClock(-25), who: 'Rafael' }],
      dscToday: [
        { p: 9, ini: '07:05', fim: '07:25', who: 'Rafael' },
        { p: 7, ini: '06:30', fim: '06:50', who: 'Ana' }
      ],
      dn: { loc: -1, gps: 'idle', q: '', ini: '', fim: '', obs: '', dist: 0 },
      dfId: null, dfFim: ''
    };
  }

  descVals(st, base) {
    const PTS = this.dscPoints();
    const SYSN = { eta: 'Sistema ETA', sj: 'Sistema São João', mor: 'Sistema Moradas', pac: 'Sistema Pacaembu' };
    const FLOW = { 50: 18, 75: 36, 100: 60, 150: 130 };
    const fmt = (n) => Math.round(n).toLocaleString('pt-BR');
    const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; };
    const durTxt = (m) => (m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min');
    const where = (p) => PTS[p][1] + ', ' + SYSN[PTS[p][2]];
    const volOf = (p, min) => FLOW[PTS[p][3]] * min / 60;
    const flowTxt = (p) => 'Vazão estimada do ponto: ' + FLOW[PTS[p][3]] + ' m³/h (rede DN ' + PTS[p][3] + ').';
    const scr = st.screen;
    const dnReset = { loc: -1, gps: 'idle', q: '', ini: '', fim: '', obs: '', dist: 0 };
    const putDn = (o) => this.setState({ dn: Object.assign({}, this.state.dn, o) });
    const nowM = toMin(this.dscClock(0));

    // ---- hub
    const run = st.dscRun.map((r) => {
      let since = nowM - toMin(r.ini); if (since < 0) since += 1440;
      return {
        addr: PTS[r.p][0], where: where(r.p), when: 'Iniciada às ' + r.ini + ' por ' + r.who, since: durTxt(since),
        open: () => this.setState({ screen: 'descargaFim', dfId: r.id, dfFim: '' })
      };
    });
    const today = st.dscToday.map((d) => {
      const m = toMin(d.fim) - toMin(d.ini);
      return { addr: PTS[d.p][0], span: d.ini + ' às ' + d.fim + ', ' + durTxt(m), who: d.who, vol: fmt(volOf(d.p, m)) };
    });

    // ---- nova descarga
    const dn = st.dn;
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const q = norm(dn.q.trim());
    const searching = dn.loc < 0 && q.length >= 2;
    const results = !searching ? [] : PTS.map((x, i) => ({ x, i }))
      .filter((o) => norm(o.x[0] + ' ' + o.x[1]).indexOf(q) >= 0).slice(0, 5)
      .map((o) => ({ addr: o.x[0], sub: where(o.i) + ', DN ' + o.x[3], pick: () => putDn({ loc: o.i, q: '', gps: 'idle', dist: 0 }) }));
    const sel = dn.loc >= 0 ? PTS[dn.loc] : null;
    const iM = toMin(dn.ini), fM = toMin(dn.fim);
    const hasIni = isFinite(iM), hasFim = isFinite(fM);
    const err = hasIni && hasFim && fM <= iM;
    const dur = hasIni && hasFim && !err ? fM - iM : NaN;
    const okNew = !!sel && hasIni && !err;
    const finished = okNew && hasFim;

    // ---- encerrar
    const rr = st.dscRun.find((r) => r.id === st.dfId) || st.dscRun[0] || { p: 0, ini: '', who: '' };
    const efI = toMin(rr.ini), efF = toMin(st.dfFim);
    const efErr = isFinite(efF) && efF <= efI;
    const efDur = isFinite(efF) && !efErr ? efF - efI : NaN;
    const efOk = isFinite(efDur);

    // ---- integração
    base.s.descarga = scr === 'descarga';
    base.s.descargaNova = scr === 'descargaNova';
    base.s.descargaFim = scr === 'descargaFim';
    base.s.nav = base.s.nav || scr === 'descarga';
    base.nav.descarga = () => this.setState({ screen: 'descarga' });
    base.nav.descargaNova = () => this.setState({ screen: 'descargaNova', dn: Object.assign({}, dnReset) });
    if (st.acc.descarga) base.accChips = base.accChips.concat(['Descargas de rede']);
    if (st.okCtx === 'descarga') {
      base.hasNext = false;
      base.backLabel = 'Voltar para Descargas de rede';
      base.on.backList = () => this.setState({ screen: 'descarga' });
    }
    const pushHist = (title, sub, t) => [{ title, sub, time: 'Hoje, ' + t, t }].concat(st.colHist);

    return {
      ds: {
        mN: st.dscMonthN, mVol: fmt(st.dscMonthVol),
        homeSub: '≈ ' + fmt(st.dscMonthVol) + ' m³ no mês' + (st.dscRun.length ? ', ' + st.dscRun.length + ' em andamento' : ''),
        run, hasRun: run.length > 0, today, todayEmpty: today.length === 0,
        cn: {
          noSel: !sel, hasSel: !!sel, busy: dn.gps === 'busy',
          gpsTxt: dn.gps === 'busy' ? 'Buscando sua localização…' : 'Usar minha localização',
          useGps: () => {
            putDn({ gps: 'busy' });
            setTimeout(() => { this.setState({ dn: Object.assign({}, this.state.dn, { gps: 'ok', loc: 1, dist: 35, q: '' }) }); }, 1100);
          },
          q: dn.q, setQ: (ev) => putDn({ q: ev.target.value }),
          results, listBd: results.length ? '1px solid #DDE5EE' : '0',
          noRes: searching && results.length === 0, hint: dn.loc < 0 && q.length < 2,
          addr: sel ? sel[0] : '', sub: sel ? where(dn.loc) + ', DN ' + sel[3] : '',
          hasDist: !!sel && dn.gps === 'ok', dist: dn.dist,
          clear: () => putDn({ loc: -1, gps: 'idle', dist: 0 }),
          ini: dn.ini, fim: dn.fim,
          setIni: (ev) => putDn({ ini: ev.target.value }), setFim: (ev) => putDn({ fim: ev.target.value }),
          iniNow: () => putDn({ ini: this.dscClock(0) }), fimNow: () => putDn({ fim: this.dscClock(0) }),
          hasDur: isFinite(dur) && !!sel, dur: isFinite(dur) ? durTxt(dur) : '', vol: isFinite(dur) && sel ? fmt(volOf(dn.loc, dur)) : '',
          flowTxt: sel ? flowTxt(dn.loc) : '', err, longWarn: isFinite(dur) && dur > 60,
          obs: dn.obs, setObs: (ev) => putDn({ obs: ev.target.value }),
          off: !okNew, op: okNew ? 1 : 0.45,
          btn: finished ? 'Registrar descarga' : 'Registrar início da descarga',
          saveHint: !sel ? 'Escolha o ponto de descarga.' : !hasIni ? 'Informe o horário de início.' : err ? 'Corrija os horários.' : finished ? 'Operador, data e horários são registrados ao salvar.' : 'Sem horário de fim, a descarga fica em andamento.',
          save: () => {
            if (!okNew) return;
            const a = sel[0];
            if (finished) {
              const v = volOf(dn.loc, dur);
              this.setState({
                dscToday: [{ p: dn.loc, ini: dn.ini, fim: dn.fim, who: (window.DB ? DB.operador() : 'Operador') }].concat(st.dscToday),
                dscMonthN: st.dscMonthN + 1, dscMonthVol: st.dscMonthVol + v, dn: Object.assign({}, dnReset),
                colHist: pushHist(a, 'Descarga de rede', dn.fim),
                screen: 'ok', okCtx: 'descarga',
                last: { title: 'Descarga registrada', sub: a, rows: [
                  { k: 'Início e fim', v: dn.ini + ' às ' + dn.fim }, { k: 'Duração', v: durTxt(dur) },
                  { k: 'Volume estimado', v: '≈ ' + fmt(v) + ' m³' }, { k: 'Sistema', v: SYSN[sel[2]] }
                ] }
              });
            } else {
              this.setState({
                dscRun: st.dscRun.concat([{ id: 'd' + st.dscSeq, p: dn.loc, ini: dn.ini, who: (window.DB ? DB.operador() : 'Operador') }]), dscSeq: st.dscSeq + 1,
                dn: Object.assign({}, dnReset), colHist: pushHist(a, 'Início de descarga', dn.ini),
                screen: 'ok', okCtx: 'descarga',
                last: { title: 'Descarga em andamento', sub: a, rows: [
                  { k: 'Início', v: dn.ini }, { k: 'Fim', v: 'Encerre em Descargas de rede' }, { k: 'Sistema', v: SYSN[sel[2]] }
                ] }
              });
            }
          }
        },
        ef: {
          addr: PTS[rr.p][0], where: where(rr.p) + ', DN ' + PTS[rr.p][3], who: rr.who, ini: rr.ini,
          fim: st.dfFim, setFim: (ev) => this.setState({ dfFim: ev.target.value }), now: () => this.setState({ dfFim: this.dscClock(0) }),
          hasDur: efOk, dur: efOk ? durTxt(efDur) : '', vol: efOk ? fmt(volOf(rr.p, efDur)) : '', flowTxt: flowTxt(rr.p),
          err: efErr, off: !efOk, op: efOk ? 1 : 0.45,
          save: () => {
            if (!efOk) return;
            const v = volOf(rr.p, efDur);
            this.setState({
              dscRun: st.dscRun.filter((r) => r.id !== rr.id),
              dscToday: [{ p: rr.p, ini: rr.ini, fim: st.dfFim, who: rr.who }].concat(st.dscToday),
              dscMonthN: st.dscMonthN + 1, dscMonthVol: st.dscMonthVol + v,
              colHist: pushHist(PTS[rr.p][0], 'Descarga de rede encerrada', st.dfFim),
              screen: 'ok', okCtx: 'descarga',
              last: { title: 'Descarga encerrada', sub: PTS[rr.p][0], rows: [
                { k: 'Início e fim', v: rr.ini + ' às ' + st.dfFim }, { k: 'Duração', v: durTxt(efDur) },
                { k: 'Volume estimado', v: '≈ ' + fmt(v) + ' m³' }
              ] }
            });
          }
        }
      }
    };
  }

  renderVals() {
    const st = this.state;
    const set = (o) => () => this.setState(o);
    const fmt = (n) => Math.round(n).toLocaleString('pt-BR');
    const fmt1 = (n) => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const num = (s) => { const t = String(s || '').trim(); if (!t) return NaN; return Number(t.replace(/\./g, '').replace(',', '.')); };
    const dec = (s) => { const t = String(s || '').trim(); if (!t) return NaN; return Number(t.replace(',', '.')); };
    const filled = (s) => String(s || '').trim() !== '';
    const now = new Date().toTimeString().slice(0, 5);

    const MAC = [
      'REL Paineiras', 'Entrada RAP Paineiras 2', 'Saída RAP Paineiras 2', 'Poço Diamantes',
      'RAP Cohab', 'REL Cohab', 'REL São João', 'Poço São João', 'Poço Pacaembu',
      'RAP Pacaembu - Zona Alta', 'RAP Pacaembu - Zona Baixa', 'Poço Moradas',
      'REL Moradas - Condomínio', 'REL Moradas - Bairros', 'REL Moradas Clube', 'Poço Ville de France',
      'R3 > São Silvestre', 'REL São Silvestre', 'Recalque Vila Margarida', 'REL Parque Minas Gerais',
      'REL Anchieta', 'Poço Nova Alcântara', 'RAP Nova Alcântara - Zona Baixa', 'RAP Nova Alcântara - Zona Alta'
    ];
    const EMAC = [
      'Poço Esmeralda', 'Retrolavagem ETA 1', 'R2 > Centro', 'R2 > Parque Minas Gerais', 'Captação ETA 2',
      'Retrolavagem ETA 2', 'Saída ETA 2', 'R2 > Paineiras', 'R2 > Anchieta', 'Captação ETA 1'
    ];
    const mk = (name, i, grp) => {
      const poco = grp === 'poco' && name.indexOf('Poço') === 0;
      const sub = grp === 'eta' ? 'Macromedidor da ETA: vazão e totalizador'
        : poco ? 'Poço: vazão, totalizador e residuais'
        : (name.indexOf('Recalque') === 0 ? 'Recalque: vazão e totalizador' : 'Reservatório: vazão e totalizador');
      const j = grp === 'eta' ? i + 40 : i;
      return {
        id: (grp === 'eta' ? 'e' : 'm') + i, name, poco, grp, sub,
        prev: 180000 + ((j * 7919 * 131) % 3900000),
        vazPrev: 25 + ((j * 37) % 50) + 0.4,
        who: j % 2 ? 'Rafael' : 'Ana',
        h: 23.8 + (j % 6) * 0.08
      };
    };
    const PTS = MAC.map((n, i) => mk(n, i, 'poco'));
    const EPTS = EMAC.map((n, i) => mk(n, i, 'eta'));
    const ALL = PTS.concat(EPTS);
    const ETES = ['ETE Choso Misato', 'ETE Moradas', 'ETE Moradas Clube', 'ETE Pacaembu', 'ETE Ville de France', 'ETE Trianon'];
    const ETA_OPTS = [
      { k: 'cal', name: 'Calibrações/Aferições de Equipamentos', sub: 'Turbidímetro, colorímetro e pHmetro' },
      { k: 'mac', name: 'Leitura de Macromedidores', sub: '10 macromedidores: vazão e totalizador' },
      { k: 'est', name: 'Estoque de Produtos Químicos', sub: 'PAC, flúor e sal, por turno' },
      { k: 'desc', name: 'Descarregamento de Produtos Químicos', sub: 'Registre cada carga recebida' }
    ];

    const chipOf = (t) => ({ status: t ? 'Lançado às ' + t : 'Pendente', chipBg: t ? '#E2F4EE' : '#FDF0DC', chipFg: t ? '#0B6B57' : '#8A3C06' });
    const reset = { tot: '', vaz: '', cl: '', fl: '', foto: false, hip: '', aci: '', totTocado: false };
    const openPoint = (id) => this.setState(Object.assign({ screen: 'poco', sel: id, tab: 'leitura' }, reset));
    const openEta = (k) => this.setState({ screen: 'eta', block: 'eta', etaMode: k, etaFilt: 'pend' });
    const openEst = (id) => this.setState(Object.assign({ screen: 'poco', block: 'pocoEst', sel: id, tab: 'estoque' }, reset));
    const PD_VAZIA = { tipo: '', qtd: '', dest: '' };
    const openPocos = (k) => (k === 'mac' ? this.setState({ screen: 'lista', block: 'poco', filt: 'pend', q: '' })
      : k === 'est' ? this.setState({ screen: 'lista', block: 'pocoEst', filt: 'todos', q: '' })
      : this.setState({ screen: 'pocoDesc', block: 'pocos', pd: [Object.assign({}, PD_VAZIA)] }));
    const openEte = (n) => this.setState({ screen: 'ete', block: 'ete', selEte: n, chk: {}, chkObs: {}, eteVaz: '', anal: null, anv: {} });

    const etaMacItems = EPTS.map((p) => Object.assign({ id: p.id, name: p.name, t: st.done[p.id], pick: () => openPoint(p.id) }, chipOf(st.done[p.id])));
    const emDone = etaMacItems.filter((x) => x.t).length;
    const etaItems = ETA_OPTS.map((o) => {
      const base = { id: o.k, name: o.name, sub: o.sub, pick: () => openEta(o.k) };
      if (o.k === 'mac') {
        const all = emDone === EPTS.length;
        return Object.assign(base, { t: all ? now : undefined, status: emDone + ' de ' + EPTS.length + ' lançados', chipBg: all ? '#E2F4EE' : '#FDF0DC', chipFg: all ? '#0B6B57' : '#8A3C06' });
      }
      if (o.k === 'desc') {
        return Object.assign(base, { noCount: true, t: undefined, status: st.descLast ? 'Último: ' + st.descLast : 'Quando chegar produto', chipBg: '#EEF3F7', chipFg: '#52627A' });
      }
      return Object.assign(base, { t: st.etaDone[o.k] }, chipOf(st.etaDone[o.k]));
    });

    // Poços: três opções, como nas ETAs (macros, estoque por poço e descarregamento).
    const POCO_OPTS = [
      { k: 'mac', name: 'Leitura de Macromedidores', sub: 'Poços, reservatórios e recalque: vazão e totalizador' },
      { k: 'est', name: 'Estoque de Produtos Químicos', sub: 'Hipoclorito e ácido fluossilícico de cada poço' },
      { k: 'desc', name: 'Descarregamento de Produtos Químicos', sub: 'Registre cada carga recebida, por poço' }
    ];
    const POCOS_EST = PTS.filter((x) => x.poco).concat(EPTS.filter((x) => x.name.indexOf('Poço') === 0));
    const pmDone = PTS.filter((x) => st.done[x.id]).length;
    const peDone = POCOS_EST.filter((x) => (st.estDone || {})[x.id]).length;
    const pocoItems = POCO_OPTS.map((o) => {
      const base = { id: o.k, name: o.name, sub: o.sub, pick: () => openPocos(o.k) };
      if (o.k === 'desc') return Object.assign(base, { noCount: true, t: undefined, status: st.pdLast ? 'Último: ' + st.pdLast : 'Quando chegar produto', chipBg: '#EEF3F7', chipFg: '#52627A' });
      const tot = o.k === 'mac' ? PTS.length : POCOS_EST.length, d = o.k === 'mac' ? pmDone : peDone, all = d === tot;
      return Object.assign(base, { t: all ? now : undefined, status: d + ' de ' + tot + ' lançados', chipBg: all ? '#E2F4EE' : '#FDF0DC', chipFg: all ? '#0B6B57' : '#8A3C06' });
    });
    const B = {
      pocos: { title: 'Poços', sub: 'Escolha o tipo de lançamento', items: pocoItems },
      pocoEst: { title: 'Estoque de Produtos Químicos', sub: 'Poços', items: POCOS_EST.map((x) => Object.assign({ id: x.id, name: x.name, sub: 'Hipoclorito e ácido fluossilícico', t: (st.estDone || {})[x.id], pick: () => openEst(x.id) }, chipOf((st.estDone || {})[x.id]))) },
      poco: { title: 'Leitura de Macromedidores', sub: 'Poços, reservatórios e recalque', items: PTS.map((p) => Object.assign({ id: p.id, name: p.name, sub: p.sub, t: st.done[p.id], pick: () => { this.setState({ block: 'poco' }); openPoint(p.id); } }, chipOf(st.done[p.id]))) },
      eta: { title: 'ETAs', sub: 'Escolha o tipo de lançamento', items: etaItems },
      ete: { title: 'ETEs', sub: 'Checklist e análises', items: ETES.map((n) => Object.assign({ id: n, name: n, sub: 'Checklist e análises', t: st.eteDone[n], pick: () => openEte(n) }, chipOf(st.eteDone[n]))) }
    };
    const stat = (k) => { const it = B[k].items.filter((x) => !x.noCount); const d = it.filter((x) => x.t).length; return { done: d, total: it.length, pend: it.length - d, pct: Math.round(d / it.length * 100) }; };
    const bk = { poco: stat('poco'), eta: stat('eta'), ete: stat('ete') };
    const keys = ['eta', 'ete', 'poco'].filter((k) => st.acc[k]);
    const allDone = keys.reduce((s, k) => s + bk[k].done, 0);
    const allTotal = keys.reduce((s, k) => s + bk[k].total, 0);

    const cbk = B[st.block];
    const q = st.q.trim().toLowerCase();
    const shown = cbk.items.filter((x) => (st.filt === 'todos' ? true : st.filt === 'pend' ? (!x.t && !x.noCount) : !!x.t) && (!q || x.name.toLowerCase().indexOf(q) >= 0));

    // ---- formulário de macromedidor
    const p = ALL.find((x) => x.id === st.sel) || PTS[0];
    const cur = num(st.tot);
    const hasCur = isFinite(cur) && cur > 0;
    const vazV = dec(st.vaz);
    const hasVaz = isFinite(vazV) && vazV >= 0;
    const vol = cur - p.prev;
    const neg = hasCur && vol < 0;
    const hh = Math.floor(p.h);
    const mm = Math.round((p.h - hh) * 60);
    const band = (v, lo, hi, loTxt, hiTxt) => {
      if (!isFinite(v)) return { txt: 'Faixa: ' + loTxt + ' a ' + hiTxt + ' mg/L', bg: '#EEF3F7', fg: '#52627A' };
      if (v < lo) return { txt: 'Abaixo da faixa', bg: '#FDF0DC', fg: '#8A3C06' };
      if (v > hi) return { txt: 'Acima da faixa', bg: '#FDF0DC', fg: '#8A3C06' };
      return { txt: 'Dentro da faixa', bg: '#E2F4EE', fg: '#0B6B57' };
    };
    const clS = band(dec(st.cl), 0.2, 2.0, '0,2', '2,0');
    const flS = band(dec(st.fl), 0.6, 0.8, '0,6', '0,8');
    const tank = (v, cap, perDay) => {
      const n = dec(v);
      const pct = isFinite(n) ? Math.max(0, Math.min(100, Math.round(n / cap * 100))) : 0;
      return { pct, col: pct < 20 ? '#D97706' : '#0091BF', dias: isFinite(n) ? Math.floor(n / perDay) : 0 };
    };
    const hipT = tank(st.hip, 1000, 58);
    const aciT = tank(st.aci, 500, 21);
    const canSave = hasCur && hasVaz;

    // ---- calibrações da ETA
    const EQUIP = [
      { name: 'Turbidímetro', fields: [
        { k: 't20', lab: '20 NTU' }, { k: 't100', lab: '100 NTU' },
        { k: 't800', lab: '800 NTU', opt: true, hint: 'Use só se a turbidez da água bruta estiver acima de 100 NTU.' },
        { k: 't10', lab: '10 NTU' }] },
      { name: 'Colorímetro', fields: [
        { k: 'c500', lab: '500 Pt-Co', opt: true, hint: 'Use só se a cor da água bruta estiver acima de 100 Pt-Co.' },
        { k: 'c100', lab: '100 Pt-Co' }, { k: 'c10', lab: '10 Pt-Co' }, { k: 'c0', lab: '0 Pt-Co' }] },
      { name: 'pHmetro', fields: [
        { k: 'p4', lab: 'pH 4' }, { k: 'p7', lab: 'pH 7' }, { k: 'p10', lab: 'pH 10' },
        { k: 'slope', lab: 'Average slope (%)' }] }
    ];
    let calReqTotal = 0, calReqDone = 0;
    const calEquip = EQUIP.map((e) => {
      const req = e.fields.filter((f) => !f.opt);
      const rd = req.filter((f) => filled(st.calv[f.k])).length;
      calReqTotal += req.length; calReqDone += rd;
      const complete = rd === req.length;
      return {
        name: e.name,
        chip: complete ? 'Completo' : rd + ' de ' + req.length,
        chipBg: complete ? '#E2F4EE' : '#EEF3F7', chipFg: complete ? '#0B6B57' : '#52627A',
        fields: e.fields.map((f) => ({
          id: 'cal-' + f.k, lab: f.lab, opt: !!f.opt, hint: f.hint || '',
          tag: f.opt ? 'Opcional' : 'Padrão de leitura',
          val: st.calv[f.k] || '',
          set: (ev) => this.setState({ calv: Object.assign({}, st.calv, { [f.k]: ev.target.value }) })
        }))
      };
    });
    const calOk = calReqDone === calReqTotal;

    // ---- estoque de produtos químicos (litros por reservatório)
    const GROUPS = [
      { k: 'pac1', name: 'PAC ETA 1', res: [['R1', 22000, 14200], ['R2', 22000, 9800], ['R3', 30000, 21500]] },
      { k: 'pac2', name: 'PAC ETA 2', res: [['R1', 10000, 6100], ['R2', 10000, 3900]] },
      { k: 'flu1', name: 'Flúor ETA 1', res: [['R1', 1000, 640], ['R2', 1000, 520], ['R3', 1000, 410], ['R4', 1000, 180]] },
      { k: 'flu2', name: 'Flúor ETA 2', res: [['R1', 2000, 950]] }
    ];
    if (st.dbOk) GROUPS.forEach((g) => g.res.forEach((r) => { const pv = (st.dbEtaPrev || {})[g.k + '-' + r[0]]; r[2] = pv != null ? pv : 0; }));
    const stockGroups = GROUPS.map((g) => {
      let sum = 0, cap = 0, any = false;
      const res = g.res.map((r) => {
        const key = g.k + '-' + r[0];
        const v = num(st.lev[key]);
        const has = isFinite(v);
        const shownV = has ? v : r[2];
        if (has) any = true;
        sum += shownV; cap += r[1];
        const pct = Math.max(0, Math.min(100, Math.round(shownV / r[1] * 100)));
        const over = has && v > r[1];
        return {
          id: 'st-' + key, name: r[0], capTxt: fmt(r[1]), prevTxt: fmt(r[2]), val: st.lev[key] || '',
          pct, col: !has ? '#C7D4E2' : pct < 20 ? '#D97706' : '#0091BF', over, bd: over ? '#D97706' : '#C7D4E2',
          set: (ev) => this.setState({ lev: Object.assign({}, st.lev, { [key]: ev.target.value }) })
        };
      });
      const gp = Math.round(sum / cap * 100);
      return { name: g.name, res, totTxt: fmt(sum) + ' de ' + fmt(cap) + ' L (' + gp + '%)' + (any ? '' : ', último registro'), totC: gp < 20 ? '#8A3C06' : '#52627A', sum };
    });

    // ---- descarregamento
    const prods = ['PAC', 'Flúor', 'Sal'].map((n) => ({
      name: n, on: st.prod === n,
      bd: st.prod === n ? '#0057A8' : '#DDE5EE', bg: st.prod === n ? '#E3EEF9' : '#FFFFFF', fg: st.prod === n ? '#0057A8' : '#0A2E5C',
      pick: () => this.setState({ prod: n })
    }));
    const descEtas = ['ETA 1', 'ETA 2'].map((n) => ({
      name: n, on: st.descEta === n,
      bd: st.descEta === n ? '#0057A8' : '#DDE5EE', bg: st.descEta === n ? '#E3EEF9' : '#FFFFFF', fg: st.descEta === n ? '#0057A8' : '#0A2E5C',
      pick: () => this.setState({ descEta: n })
    }));
    const kg = num(st.descKg);
    const hasKg = isFinite(kg) && kg > 0;
    const DENS = { PAC: 1.25, 'Flúor': 1.20 };
    const descConv = !st.prod || !hasKg ? '' : st.prod === 'Sal' ? 'Equivale a ' + fmt(kg / 25) + ' sacos de 25 kg' : 'Equivale a cerca de ' + fmt(kg / DENS[st.prod]) + ' L (densidade ' + String(DENS[st.prod]).replace('.', ',') + ')';
    const descOk = !!st.prod && !!st.descEta && hasKg;

    // ---- ETE
    const CHK = [
      { k: 'grades', name: 'Limpeza das grades' },
      { k: 'elev', name: 'Elevatória' },
      { k: 'sopr', name: 'Sopradores' },
      { k: 'reciclo', name: 'Reciclo de lodo' },
      { k: 'areia', name: 'Limpeza da caixa de areia' },
      { k: 'dist', name: 'Limpeza da caixa de distribuição' }
    ];
    const chkItems = CHK.map((c) => {
      const v = st.chk[c.k];
      return {
        name: c.name, isOk: v === 'ok', isNc: v === 'nc',
        okBg: v === 'ok' ? '#0B6B57' : '#FFFFFF', okFg: v === 'ok' ? '#FFFFFF' : '#0B6B57', okBd: v === 'ok' ? '#0B6B57' : '#B9D9CE',
        ncBg: v === 'nc' ? '#B45309' : '#FFFFFF', ncFg: v === 'nc' ? '#FFFFFF' : '#9A4508', ncBd: v === 'nc' ? '#B45309' : '#E8C9A5',
        setOk: () => this.setState({ chk: Object.assign({}, st.chk, { [c.k]: 'ok' }) }),
        setNc: () => this.setState({ chk: Object.assign({}, st.chk, { [c.k]: 'nc' }) }),
        obsId: 'nc-' + c.k, obs: st.chkObs[c.k] || '',
        setObs: (ev) => this.setState({ chkObs: Object.assign({}, st.chkObs, { [c.k]: ev.target.value }) })
      };
    });
    const chkDone = CHK.filter((c) => st.chk[c.k]).length;
    const ncMissing = CHK.filter((c) => st.chk[c.k] === 'nc' && !filled(st.chkObs[c.k])).length;
    const ncN = CHK.filter((c) => st.chk[c.k] === 'nc').length;
    const vazMissing = !filled(st.eteVaz);
    const eteOk = !vazMissing && chkDone === CHK.length && ncMissing === 0 && st.anal !== null;
    const eteHint = vazMissing ? 'Anote a vazão da ETE em m³/h.'
      : chkDone < CHK.length ? 'Marque OK ou NC em todos os itens do checklist.'
      : ncMissing ? 'Explique cada item marcado como NC.'
      : st.anal === null ? 'Responda se vai lançar as análises nesta visita.'
      : 'Data, hora e operador são registrados ao salvar.';
    const yn = (on) => ({ bd: on ? '#0057A8' : '#DDE5EE', bg: on ? '#E3EEF9' : '#FFFFFF', fg: on ? '#0057A8' : '#0A2E5C' });
    const aY = yn(st.anal === true), aN = yn(st.anal === false);
    const an = {
      yes: st.anal === true, no: st.anal === false,
      setYes: set({ anal: true }), setNo: set({ anal: false }),
      yBd: aY.bd, yBg: aY.bg, yFg: aY.fg, nBd: aN.bd, nBg: aN.bg, nFg: aN.fg,
      note: st.anal === true ? 'Preencha as análises completas abaixo.' : st.anal === false ? 'A visita será registrada só com vazão e checklist.' : 'As análises completas são feitas uma vez por semana em cada ETE.'
    };
    const two = 'repeat(2, minmax(0, 1fr))', three = 'repeat(3, minmax(0, 1fr))';
    const pair = (id, name) => ({ name, cols: two, fields: [{ id: id + '-b', lab: 'Bruto' }, { id: id + '-t', lab: 'Tratado' }] });
    const eteAn = [
      pair('an-ph', 'pH'),
      pair('an-temp', 'Temperatura (°C)'),
      pair('an-od', 'OD (mg/L)'),
      pair('an-sol', 'Sólidos sedimentáveis (mL/L)'),
      { name: 'DQO (mg/L)', cols: three, fields: [{ id: 'an-dqo-p', lab: 'Padrão' }, { id: 'an-dqo-b', lab: 'Bruto' }, { id: 'an-dqo-t', lab: 'Tratado' }] }
    ];
    eteAn.forEach((g) => {
      g.fields.forEach((fl) => {
        fl.val = (st.anv || {})[fl.id] || '';
        fl.set = (ev) => this.setState({ anv: Object.assign({}, this.state.anv, { [fl.id]: ev.target.value }) });
      });
      const pd = dec((st.anv || {})['an-dqo-p']);
      const dd = isFinite(pd) ? Math.abs(pd - 500) / 500 * 100 : 0;
      g.alerta = g.name.indexOf('DQO') === 0 && isFinite(pd) && dd > 10;
      g.alertaTxt = 'Padrão com desvio de ' + Math.round(dd) + '% em relação a 500 mg/L. A análise de DQO está comprometida: o recomendado é refazer o padrão.';
    });

    // ---- histórico
    const hist = [];
    Object.keys(st.done).forEach((id) => { const pt = ALL.find((x) => x.id === id); hist.push({ title: pt.name, sub: pt.grp === 'eta' ? 'Macromedidor da ETA' : 'Leitura de macromedidor', time: 'Hoje, ' + st.done[id], t: st.done[id] }); });
    Object.keys(st.etaDone).forEach((k) => { const o = ETA_OPTS.find((x) => x.k === k); hist.push({ title: o.name, sub: 'ETAs', time: 'Hoje, ' + st.etaDone[k], t: st.etaDone[k] }); });
    Object.keys(st.eteDone).forEach((n) => hist.push({ title: n, sub: 'Checklist e análises', time: 'Hoje, ' + st.eteDone[n], t: st.eteDone[n] }));
    hist.sort((a, b) => (a.t < b.t ? 1 : -1));

    // ---- navegação
    const isEtaMac = st.okCtx === 'etamac';
    const nextItem = isEtaMac ? etaMacItems.find((x) => !x.t) : cbk.items.find((x) => !x.t && !x.noCount);
    const scr = st.screen;
    const navOn = ['home', 'hist', 'perfil', 'lista'].indexOf(scr) >= 0;
    const nvc = (on) => (on ? '#0057A8' : '#5B6B82');
    const nvb = (on) => (on ? '#E3EEF9' : 'transparent');
    const seg = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0A2E5C' : '#52627A' });
    const chip = (on) => ({ bg: on ? '#0A2E5C' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0A2E5C', bd: on ? '#0A2E5C' : '#C7D4E2' });
