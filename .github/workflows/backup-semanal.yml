# Backup semanal do banco do Supabase (o plano gratuito não faz backup automático).
#
# Toda segunda-feira às 3h (horário de Brasília) o GitHub gera uma cópia completa do banco:
# papéis, estrutura (tabelas, regras de acesso, funções) e dados (lançamentos, perfis e logins).
# O arquivo sai criptografado com a senha de backup e fica guardado por 90 dias
# em Actions > "Backup semanal do banco" > (execução) > Artifacts.
#
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL  - "Session pooler" do Supabase (botão Connect), com a senha do banco
#   BACKUP_SENHA     - senha para criptografar o backup (guarde-a: sem ela o backup não abre)
#
# Como restaurar: ver LEIA-ME.md, seção "Backup".
name: Backup semanal do banco

on:
  schedule:
    - cron: "0 6 * * 1" # segunda-feira, 06:00 UTC = 03:00 em Brasília
  workflow_dispatch: # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: read

concurrency:
  group: backup-banco
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir os segredos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Cadastre os segredos SUPABASE_DB_URL e BACKUP_SENHA em Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ ${#BACKUP_SENHA} -lt 12 ]; then
            echo "::error::A BACKUP_SENHA precisa ter pelo menos 12 caracteres."
            exit 1
          fi

      - name: Instalar o Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Gerar o backup (papéis, estrutura e dados)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vector_indexes"
          # Sem os dados, não é backup: falha se algum arquivo saiu vazio.
          for f in roles schema data; do
            test -s "backup/$f.sql" || { echo "::error::backup/$f.sql saiu vazio."; exit 1; }
          done
          ls -la backup

      - name: Criptografar com a senha de backup
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          nome="backup-gsinima-$(TZ=America/Sao_Paulo date +%Y-%m-%d)"
          tar -czf "$nome.tar.gz" backup
          printf '%s' "$BACKUP_SENHA" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$nome.tar.gz.gpg" "$nome.tar.gz"
          rm -rf backup "$nome.tar.gz"
          ls -la "$nome.tar.gz.gpg"
          echo "NOME_BACKUP=$nome" >> "$GITHUB_ENV"

      - name: Guardar o backup (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME_BACKUP }}
          path: ${{ env.NOME_BACKUP }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
