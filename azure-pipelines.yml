# Azure DevOps: publica a versão Azure do site (Azure Static Web Apps) a cada envio para a branch "azure".
#
# Monta o site com MODO=azure (login Microsoft, sem logos, nome da empresa genérico) e envia o site e a
# ponte /api (pasta api/) para o Static Web Apps "swa-ourinhos-saneamento".
#
# Variável secreta necessária no pipeline (Pipelines > este pipeline > Edit > Variables):
#   AZURE_STATIC_WEB_APPS_API_TOKEN - token de implantação do Static Web Apps
#   (portal do Azure > swa-ourinhos-saneamento > Gerenciar token de implantação), marcada como secreta.

trigger:
  branches:
    include: [azure]

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Usar Node 20
    inputs:
      versionSpec: '20.x'

  - script: |
      npm ci
      MODO=azure node scripts/build.js
    displayName: Montar o site (versão Azure)

  - task: AzureStaticWebApp@0
    displayName: Publicar no Azure Static Web Apps
    inputs:
      app_location: dist
      api_location: api
      output_location: ''
      skip_app_build: true
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
