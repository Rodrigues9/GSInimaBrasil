s\u00e3o dos descarregamentos:<\/strong> PAC com densidade 1,25 kg/L, \u00e1cido fluossil\u00edcico com 1,20 kg/L e sal em sacos de 25 kg. O administrador pode alterar esses valores.<\/li>\n          <\/ul>\n        <\/section>\n      <\/div>\n\n      <p style=\"margin: 0; font-size: 13px; color: #52627A\">Os n\u00fameros deste prot\u00f3tipo s\u00e3o de exemplo. No sistema, v\u00eam dos lan\u00e7amentos de estoque e descarregamento feitos no app.<\/p>\n    <\/div>\n  <\/main>\n<\/div>\n", cls: (function (DCLogic) {

\">\n          <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px\">\n            <thead><tr style=\"text-align: left; color: #52627A\"><th style=\"padding: 8px 6px\">Quando<\/th><th style=\"padding: 8px 6px\">Tipo<\/th><th style=\"padding: 8px 6px\">Arquivo<\/th><th style=\"padding: 8px 6px\">Por<\/th><th style=\"padding: 8px 6px; text-align: right\">Linhas<\/th><\/tr><\/thead>\n            <tbody>\n              <sc-for list=\"{{ log }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <tr style=\"border-top: 1px solid #EEF3F7\">\n                  <td style=\"padding: 10px 6px; color: #52627A\">{{ l.when }}<\/td>\n                  <td style=\"padding: 10px 6px\"><span style=\"padding: 2px 8px; border-radius: 8px; font-weight: 700; background: {{ l.bg }}; color: {{ l.fg }}\">{{ l.type }}<\/span><\/td>\n                  <td style=\"padding: 10px 6px; font-weight: 700; color: #0A2E5C\">{{ l.file }}<\/td>\n                  <td style=\"padding: 10px 6px\">{{ l.who }}<\/td>\n                  <td style=\"padding: 10px 6px; text-align: right; font-variant-numeric: tabular-nums\">{{ l.rows }}<\/td>\n                <\/tr>\n              <\/sc-for>\n            <\/tbody>\n          <\/table>\n          <sc-if value=\"{{ semLog }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin: 10px 6px 0; color: #52627A; font-size: 14px\">As exporta\u00e7\u00f5es feitas nesta tela aparecem aqui.<\/p><\/sc-if>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/main>\n<\/div>\n", cls: (function (DCLogic) {

e }}\"><p style=\"margin: 0; color: #52627A\">Nenhum lan\u00e7amento no per\u00edodo.<\/p><\/sc-if>\n        <sc-if value=\"{{ temMais }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" onClick=\"{{ mais }}\" style=\"align-self: center; height: 40px; padding: 0 18px; border: 1.5px solid #C7D4E2; border-radius: 12px; background: #FFFFFF; color: #0A2E5C; font-weight: 700; cursor: pointer\">{{ maisTxt }}<\/button><\/sc-if>\n      <\/section>\n    <\/div>\n  <\/main>\n<\/div>\n", cls: (function (DCLogic) {

class Component extends DCLogic {

    const deHoje = rows.filter((r) => new Date(r.criado_em) >= hoje);
    const turnoHoje = (t) => deHoje.some((r) => r.turno === t) ? 'feito' : 'pendente';
    const kpis = [
      { titulo: 'Calibrações no período', valor: br(rows.length, 0), cor: '#0A2E5C', sub: 'Diurno ' + rows.filter((r) => r.turno === 'Diurno').length + ' · Noturno ' + rows.filter((r) => r.turno === 'Noturno').length },
      { titulo: 'Dentro da tolerância', valor: rows.length ? br((rows.length - comDesvio) / rows.length * 100, 0) + '%' : '—', cor: comDesvio ? '#8A3C06' : '#0B6B57', sub: comDesvio + ' com alguma leitura fora' },
      { titulo: 'Última calibração', valor: ult ? dataHora(ult.criado_em).slice(0, 5) + ' ' + dataHora(ult.criado_em).slice(11) : '—', cor: '#0A2E5C', sub: ult ? (ult.operador || '') + ' · ' + (ult.turno || '') : 'nenhuma no período' },
      { titulo: 'Hoje', valor: deHoje.length ? deHoje.length + (deHoje.length > 1 ? ' calibrações' : ' calibração') : 'Nenhuma', cor: deHoje.length ? '#0B6B57' : '#8A3C06', sub: 'Diurno ' + turnoHoje('Diurno') + ' · Noturno ' + turnoHoje('Noturno') }

    const g = { tem: pts.length > 0, vazio: !st.carregando && pts.length === 0, legenda: 'Faixa verde: tolerância (' + br(f[0]) + ' a ' + br(f[1]) + ')', aria: 'Gráfico das leituras de ' + ROTULO[k] };

lor: #0A2E5C\">Observa\u00e7\u00f5es<\/label>\n        <textarea id=\"oe-obs\" rows=\"4\" value=\"{{ obs }}\" onInput=\"{{ setObs }}\" placeholder=\"Informa\u00e7\u00f5es relevantes da opera\u00e7\u00e3o neste hor\u00e1rio\" style=\"min-height: 104px; border: 1.5px solid #C7D4E2; border-radius: 12px; padding: 12px; font-size: 16px; font-family: inherit; line-height: 1.45; resize: vertical; width: 100%; box-sizing: border-box\"><\/textarea>\n      <\/section>\n\n      <div style=\"display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap\">\n        <button type=\"button\" onClick=\"{{ limpar }}\" disabled=\"{{ salvando }}\" style=\"height: 48px; padding: 0 20px; border: 1.5px solid #C7D4E2; border-radius: 12px; background: #FFFFFF; color: #0A2E5C; font-weight: 700; font-size: 15px; cursor: pointer\">Limpar campos<\/button>\n        <button type=\"button\" onClick=\"{{ salvar }}\" disabled=\"{{ salvando }}\" style=\"height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #0057A8; color: #FFFFFF; font-weight: 700; font-size: 15px; cursor: pointer\">{{ salvarTxt }}<\/button>\n      <\/div>\n      <\/sc-if>\n    <\/div>\n  <\/main>\n<\/div>\n", cls: (function (DCLogic) {
// WebOperacaoEta: lançamento da operação das ETAs Pardo I e Pardo II. Grava em ourinhos_operacao_etas (js/db.js).
// Os nomes dos operadores vêm das contas com o cargo "Operador de ETA" (primeiro nome).
const sem = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const pad = (n) => String(n).padStart(2, '0');

const horaCheia = () => { const d = new Date(); let h = d.getHours(); if (d.getMinutes() >= 30) h = (h + 1) % 24; return pad(h) + ':00'; };
const num = (t) => { const x = String(t || '').trim(); if (!x) return null; const n = Number(x.replace(',', '.')); return isFinite(n) ? n : NaN; };
const br = (n, casas) => n.toLocaleString('pt-BR', { maximumFractionDigits: casas });
const FILTROS = [1, 2, 3, 4, 5, 6, 7, 8];
const cores = (on) => ({ bd: on ? '#0057A8' : '#C7D4E2', bg: on ? '#0057A8' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0A2E5C' });
// Cada ETA: bombas da captação (e quantas podem estar ligadas juntas) e número de decantadores.
const ETAS = {
  pardo1: { nome: 'ETA Pardo I', bombas: ['1', '2'], maxBombas: 1, decantadores: 2 },
  pardo2: { nome: 'ETA Pardo II', bombas: ['1', '2', '3', '4'], maxBombas: 2, decantadores: 4 }
};
// Cores das caixas: da água bruta (parda) até a tratada (azul claro).
const COR = { captacao: '#8A6A3B', pac: '#8F8A55', decantada: '#5F9C8A', filtrada: '#3D9CC8', tratada: '#7FD0F0' };
const textoLavagem = (l) => (l.filtros.length === 8 ? 'Todos' : l.filtros.join(', ')) + ' · ' + l.inicio + '–' + l.fim;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, eta: null, hora: horaCheia(), ops: ['', '', ''], sugDe: -1, f: {}, bombas: {}, lav: null, lavAberta: false, lavTmp: null, obs: '', salvando: false, tentou: false, lista: [], listaOk: false };
  }
  componentDidMount() {
    if (window.DB && window.DB.operadoresEta) {
      window.DB.operadoresEta().then((lista) => this.setState({ lista, listaOk: true }), () => this.setState({ listaOk: true }));
    }
  }
  doLista(t) { return this.state.lista.find((n) => sem(n) === sem(t)) || null; }
  // Campos numéricos por etapa: [chave no estado, chave no banco, rótulo (abreviado), unidade, nome completo]
  campos(eta) {

ding: 0 16px; border-radius: 999px; border: 1.5px solid {{ f.pendBd }}; background: {{ f.pendBg }}; color: {{ f.pendFg }}; font-weight: 700; font-size: 14px; cursor: pointer\">Pendentes ({{ cb.pend }})<\/button>\n      <button type=\"button\" onClick=\"{{ f.ok }}\" aria-pressed=\"{{ f.okOn }}\" style=\"height: 38px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{ f.okBd }}; background: {{ f.okBg }}; color: {{ f.okFg }}; font-weight: 700; font-size: 14px; cursor: pointer\">Lan\u00e7ados<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"scr\" style=\"flex: 1; overflow-y: auto; padding: 8px 16px 100px; display: flex; flex-direction: column; gap: 10px\">\n    <sc-for list=\"{{ shown }}\" as=\"p\" hint-placeholder-count=\"6\">\n      <button type=\"button\" onClick=\"{{ p.pick }}\" style=\"text-align: left; border: 1px solid #DDE5EE; background: #FFFFFF; border-radius: 18px; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #0F1E2E\">\n        <span style=\"display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0\">\n          <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; color: #0A2E5C\">{{ p.name }}<\/span>\n          <span style=\"font-size: 14px; color: #52627A\">{{ p.sub }}<\/span>\n          <sc-if value=\"{{ p.status }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"align-self: flex-start; margin-top: 4px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: {{ p.chipBg }}; color: {{ p.chipFg }}\">{{ p.status }}<\/span><\/sc-if>\n        <\/span>\n        <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#52627A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 5l7 7-7 7\"/><\/svg>\n      <\/button>\n    <\/sc-for>\n    <sc-if value=\"{{ emptyList }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"text-align: center; color: #52627A; padding: 32px 12px\">Nenhuma unidade neste filtro.<\/p>\n    <\/sc-if>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ============ FORMUL\u00c1RIO DE MACROMEDIDOR ============ -->\n<sc-if value=\"{{ s.poco }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column\">\n  <div style=\"background: #FFFFFF; padding: 14px 16px 12px 8px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #DDE5EE\">\n    <div style=\"display: flex; align-items: center; gap: 4px\">\n      <button type=\"button\" aria-label=\"Voltar\" onClick=\"{{ nav.formBack }}\" style=\"width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0A2E5C; cursor: pointer; flex-shrink: 0\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n      <div style=\"display: flex; flex-direction: column; min-width: 0\">\n        <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; color: #0A2E5C\">{{ p.name }}<\/span>\n        <span style=\"font-size: 13px; color: #52627A\">{{ p.sub }}<\/span>\n      <\/div>\n    <\/div>\n    <sc-if value=\"{{ mostraAbas }}\" hint-placeholder-val=\"{{ false }}\">\n    <div role=\"tablist\" style=\"margin-left: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #EEF3F7; padding: 4px; border-radius: 14px\">\n      <button type=\"button\" role=\"tab\" aria-selected=\"{{ t.lOn }}\" onClick=\"{{ t.leit }}\" style=\"height: 40px; border: 0; border-radius: 11px; font-weight: 700; font-size: 14px; cursor: pointer; background: {{ t.lBg }}; color: {{ t.lFg }}\">Leitura di\u00e1ria<\/button>\n      <button type=\"button\" role=\"tab\" aria-selected=\"{{ t.eOn }}\ C\">Totalizador<\/label>\n            <span style=\"font-size: 13px; color: #52627A\">{{ p.lastTxt }}<\/span>\n          <\/div>\n          <span style=\"font-size: 14px; color: #52627A; margin-top: -2px\">Leitura anterior: <strong style=\"color: #0A2E5C; font-variant-numeric: tabular-nums\">{{ p.prevTxt }} m\u00b3<\/strong><\/span>\n          <div style=\"position: relative\">\n            <input id=\"tot\" type=\"text\" inputmode=\"numeric\" placeholder=\"0\" value=\"{{ tot }}\" onChange=\"{{ on.tot }}\" onBlur=\"{{ on.totSair }}\" style=\"width: 100%; box-sizing: border-box; height: 70px; border: 2px solid #C7D4E2; border-radius: 18px; padding: 0 64px 0 18px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 0.5px; color: #0F1E2E; background: #F8FAFC; font-variant-numeric: tabular-nums\" />\n            <span style=\"position: absolute; right: 18px; top: 22px; font-weight: 700; font-size: 18px; color: #52627A\">m\u00b3<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div style=\"background: #0A2E5C; border-radius: 22px; padding: 18px; color: #FFFFFF; position: relative; overflow: hidden\">\n        <svg viewBox=\"0 0 360 60\" preserveAspectRatio=\"none\" style=\"position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 60px\" aria-hidden=\"true\"><path d=\"M0 30 C 60 10, 120 50, 180 30 S 300 10, 360 30 V60 H0z\" fill=\"#3FB3D1\" opacity=\"0.28\"/><path d=\"M0 40 C 70 24, 140 56, 210 40 S 320 26, 360 38 V60 H0z\" fill=\"#3FB3D1\" opacity=\"0.4\"/><\/svg>\n        <div style=\"position: relative; display: flex; flex-direction: column; gap: 2px\">\n          <span style=\"font-size: 14px; color: #C9D8EA\">Volume no intervalo<\/span>\n          <span style=\"font-family: 'Inter', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.05; letter-spacing: -0.5px; font-variant-numeric: tabular-nums\">{{ volTxt }} <span style=\"font-size: 22px; font-weight: 700\">m\u00b3<\/span><\/span>\n          <div style=\"display: flex; gap: 22px; margin-top: 10px\">\n            <span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 13px; color: #C9D8EA\">Intervalo<\/span><span style=\"font-weight: 700; font-size: 16px\">{{ hrsTxt }}<\/span><\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n      <sc-if value=\"{{ neg }}\" hint-placeholder-val=\"{{ false }}\">\n        <div role=\"alert\" style=\"background: #FDF0DC; color: #7A3606; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; font-size: 14px\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 1px\"><path d=\"M12 3l9.5 17h-19z\"/><path d=\"M12 10v4\"/><path d=\"M12 17.5v.5\"/><\/svg>\n          <span>O totalizador n\u00e3o pode ser menor que a leitura anterior ({{ p.prevTxt }} m\u00b3). Confira o n\u00famero no visor do medidor.<\/span>\n        <\/div>\n      <\/sc-if>\n\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <label for=\"obs\" style=\"font-weight: 700; font-size: 14px; color: #0A2E5C\">Observa\u00e7\u00f5es (opcional)<\/label>\n        <textarea id=\"obs\" rows=\"3\" placeholder=\"Ex.: medidor com vazamento na flange\" style=\"border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 12px 14px; font-size: 16px; background: #FFFFFF; resize: none\"><\/textarea>\n      <\/div>\n\n      <p style=\"margin: 2px 4px 0; font-size: 13px; color: #52627A\">{{ saveHint }}<\/p>\n      <button type=\"button\" onClick=\"{{ on.saveLeitura }}\" disabled=\"{{ saveOff }}\" style=\"height: 58px; border: 0; border-radius: 18px; background: #0057A8; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer; opacity: {{ saveOp }}\">Registrar leitura<\/button>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showEstoque }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin: 0 4px; font-size: 15px; color: #52627A\">Informe o volume atual de cada reservat\u00f3rio de insumo.<\/p>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n        <div style=\"background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"height: 150px; border-radius: 16px; background: #E3ECF4; position: relative; overflow: hidden\" aria-hidden=\"true\">\n            <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: {{ hipPct }}%; background: {{ hipCol }}\"><\/div>\n            <span style=\"position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 26px; color: {{ hipTxtCor }}\">{{ hipPct }}%<\/span>\n          <\/div>\n          <span style=\"font-weight: 700; font-size: 15px; color: #0A2E5C\">Hipoclorito de s\u00f3dio<\/span>\n          <input id=\"hip\" type=\"text\" inputmode=\"numeric\" aria-label=\"Volume atual de hipoclorito (L)\" placeholder=\"Litros\" value=\"{{ hip }}\" onChange=\"{{ on.hip }}\" style=\"height: 48px; border: 1.5px solid {{ hipBd }}; border-radius: 12px; padding: 0 12px; font-size: 20px; font-weight: 700; background: #F8FAFC; min-width: 0\" />\n          <span style=\"font-size: 13px; color: #52627A\">Cerca de {{ hipDias }} dias de uso<\/span><sc-if value=\"{{ hipAcima }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-size: 12px; color: #B42318\">{{ hipAcimaTxt }}<\/span><\/sc-if>\n        <\/div>\n        <div style=\"background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 10px\">\n          <div style=\"height: 150px; border-radius: 16px; background: #E3ECF4; position: relative; overflow: hidden\" aria-hidden=\"true\">\n            <div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: {{ aciPct }}%; background: {{ aciC tyle=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px\">\n        <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; color: #0A2E5C\">An\u00e1lises<\/span>\n        <span style=\"font-size: 14px; color: #52627A\">{{ col.an.n }} de 6 lan\u00e7adas<\/span>\n      <\/div>\n      <sc-for list=\"{{ col.an.nums }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid #EEF3F7\">\n          <div style=\"display: flex; align-items: center; gap: 12px\">\n            <label for=\"{{ f.id }}\" style=\"flex: 1; display: flex; flex-direction: column\">\n              <span style=\"font-weight: 700; font-size: 16px; color: #0F1E2E\">{{ f.lab }}<\/span>\n              <span style=\"font-size: 12px; color: #52627A\">{{ f.unit }}<\/span>\n            <\/label>\n            <input id=\"{{ f.id }}\" type=\"text\" inputmode=\"decimal\" placeholder=\"{{ f.ph }}\" value=\"{{ f.val }}\" onChange=\"{{ f.set }}\" style=\"width: 118px; height: 48px; border: 1.5px solid #C7D4E2; border-radius: 12px; padding: 0 12px; font-size: 18px; font-weight: 700; background: #F8FAFC; text-align: right; font-variant-numeric: tabular-nums\" />\n          <\/div>\n          <span style=\"align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 8px; background: {{ f.chip.bg }}; color: {{ f.chip.fg }}\">{{ f.chip.txt }}<\/span>\n        <\/div>\n      <\/sc-for>\n      <sc-for list=\"{{ col.an.bools }}\" as=\"b\" hint-placeholder-count=\"2\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid #EEF3F7\">\n          <div style=\"display: flex; align-items: center; gap: 10px\">\n            <span style=\"flex: 1; display: flex; flex-direction: column\"><span style=\"font-weight: 700; font-size: 16px; color: #0F1E2E\">{{ b.lab }}<\/span><span style=\"font-size: 12px; color: #52627A\">em 100 mL<\/span><\/span>\n            <div role=\"radiogroup\" aria-label=\"{{ b.lab }}\" style=\"display: flex; gap: 6px\">\n              <button type=\"button\" role=\"radio\" aria-checked=\"{{ b.isA }}\" onClick=\"{{ b.setA }}\" style=\"height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; border: 1.5px solid {{ b.aBd }}; background: {{ b.aBg }}; color: {{ b.aFg }}\">Ausente<\/button>\n              <button type=\"button\" role=\"radio\" aria-checked=\"{{ b.isP }}\" onClick=\"{{ b.setP }}\" style=\"height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; border: 1.5px solid {{ b.pBd }}; background: {{ b.pBg }}; color: {{ b.pFg }}\">Presente<\/button>\n            <\/div>\n          <\/div>\n          <sc-if value=\"{{ b.isP }}\" hint-placeholder-val=\"{{ false }}\">\n            <span role=\"alert\" style=\"font-size: 13px; color: #8C1D18; background: #FCE8E6; border-radius: 8px; padding: 8px 10px\">Fora do padr\u00e3o de potabilidade. Ao concluir, a supervis\u00e3o \u00e9 avisada para recoleta.<\/span>\n          <\/sc-if>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <p style=\"margin: 0 4px; font-size: 13px; color: #52627A\">{{ col.an.hint }}<\/p>\n    <button type=\"button\" onClick=\"{{ col.an.conclude }}\" disabled=\"{{ col.an.off }}\" style=\"height: 58px; border: 0; border-radius: 18px; background: #0057A8; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer; opacity: {{ col.an.op }}\">Concluir an\u00e1lises<\/button>\n    <button type=\"button\" onClick=\"{{ col.an.savePartial }}\" style=\"height: 52px; border: 1.5px solid #C7D4E2; border-radius: 18px; background: #FFFFFF; color: #0A2E5C; font-size: 16px; font-weight: 700; cursor: pointer\">Salvar e terminar depois<\/button>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ============ DESCARGAS DE REDE ============ -->\n<sc-if value=\"{{ s.descarga }}\" hint-placeh -weight: 700; color: #C9D8EA\">m\u00b3<\/span><\/span><\/span>\n    <\/div>\n    <button type=\"button\" onClick=\"{{ nav.descargaNova }}\" style=\"height: 56px; border: 0; border-radius: 18px; background: #0057A8; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14\"/><path d=\"M5 12h14\"/><\/svg>Nova descarga\n    <\/button>\n\n    <sc-if value=\"{{ ds.hasRun }}\" hint-placeholder-val=\"{{ true }}\">\n      <span style=\"font-weight: 700; color: #0A2E5C; padding: 4px 4px 0\">Em andamento<\/span>\n      <sc-for list=\"{{ ds.run }}\" as=\"r\" hint-placeholder-count=\"1\">\n        <button type=\"button\" onClick=\"{{ r.open }}\" style=\"text-align: left; border: 1.5px solid #E8B77A; background: #FFFBF5; border-radius: 18px; padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #0F1E2E\">\n          <span style=\"display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0\">\n            <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; color: #0A2E5C\">{{ r.addr }}<\/span>\n            <span style=\"font-size: 13px; color: #52627A\">{{ r.where }}<\/span>\n            <span style=\"font-size: 13px; color: #52627A\">{{ r.when }}<\/span>\n            <span style=\"align-self: flex-start; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #FDF0DC; color: #8A3C06\">Aberta h\u00e1 {{ r.since }}. Toque para encerrar<\/span>\n          <\/span>\n          <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#8A3C06\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 5l7 7-7 7\"/><\/svg>\n        <\/button>\n      <\/sc-for>\n    <\/sc-if>\n\n    <span style=\"font-weight: 700; color: #0A2E5C; padding: 4px 4px 0\">Encerradas hoje<\/span>\n    <sc-for list=\"{{ ds.today }}\" as=\"d\" hint-placeholder-count=\"2\">\n      <div style=\"background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px\">\n        <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0\">\n          <span style=\"font-weight: 700; color: #0A2E5C\">{{ d.addr }}<\/span>\n          <span style=\"font-size: 13px; color: #52627A\">{{ d.span }}, por {{ d.who }}<\/span>\n        <\/span>\n        <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; color: #0A2E5C; white-space: nowrap; font-variant-numeric: tabular-nums\">\u2248 {{ d.vol }} m\u00b3<\/span>\n      <\/div>\n    <\/sc-for>\n    <sc-if value=\"{{ ds.todayEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin: 0; color: #52627A; padding: 4px\">Nenhuma descarga encerrada hoje.<\/p>\n    <\/sc-if>\n    <p style=\"margin: 4px 4px 0; font-size: 13px; color: #52627A\">O volume \u00e9 estimado pela vaz\u00e3o cadastrada de cada ponto multiplicada pela dura\u00e7\u00e3o da descarga.<\/p>\n  <\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ============ NOVA DESCARGA ============ -->\n<sc-if value=\"{{ s.descargaNova }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column\">\n  <div style=\"background: #FFFFFF; padding: 14px 16px 14px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #DDE5EE\">\n    <button type=\"button\" aria-label=\"Voltar\" onClick=\"{{ nav.home }}\" style=\"width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0A2E5C; cursor: pointer\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\ ds-busca\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Endere\u00e7o do ponto de descarga<\/label>\n          <input id=\"ds-busca\" type=\"search\" autocomplete=\"off\" placeholder=\"Ex.: Rua Goi\u00e1s\" value=\"{{ ds.cn.q }}\" onChange=\"{{ ds.cn.setQ }}\" style=\"width: 100%; box-sizing: border-box; height: 50px; border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 0 16px 0 44px; font-size: 16px; background: #F8FAFC\" />\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#52627A\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position: absolute; left: 14px; top: 15px\"><circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.5-4.5\"/><\/svg>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: {{ ds.cn.listBd }}\">\n          <sc-for list=\"{{ ds.cn.results }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <button type=\"button\" onClick=\"{{ r.pick }}\" style=\"text-align: left; border: 0; border-bottom: 1px solid #EEF3F7; background: #FFFFFF; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: #0F1E2E\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0057A8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0\"><path d=\"M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/><\/svg>\n              <span style=\"display: flex; flex-direction: column; min-width: 0\"><span style=\"font-weight: 700; color: #0A2E5C\">{{ r.addr }}<\/span><span style=\"font-size: 13px; color: #52627A\">{{ r.sub }}<\/span><\/span>\n            <\/button>\n          <\/sc-for>\n        <\/div>\n        <sc-if value=\"{{ ds.cn.noRes }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin: 0; font-size: 14px; color: #8A3C06\">Nenhum ponto de descarga cadastrado com esse endere\u00e7o. Confira a grafia ou pe\u00e7a ao administrador para cadastrar o ponto.<\/p>\n        <\/sc-if>\n        <sc-if value=\"{{ ds.cn.hint }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin: 0; font-size: 13px; color: #52627A\">Digite pelo menos duas letras para ver os pontos cadastrados.<\/p>\n        <\/sc-if>\n      <\/sc-if>\n      <sc-if value=\"{{ ds.cn.hasSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; gap: 12px; align-items: flex-start; background: #F2F7FD; border: 1.5px solid #0057A8; border-radius: 16px; padding: 14px\">\n          <span style=\"width: 40px; height: 40px; border-radius: 12px; background: #0057A8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z\"/><circle cx=\"12\" cy=\"9.5\" r=\"2.5\"/><\/svg><\/span>\n          <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0\">\n            <span style=\"font-weight: 700; color: #0A2E5C\">{{ ds.cn.addr }}<\/span>\n            <span style=\"font-size: 13px; color: #52627A\">{{ ds.cn.sub }}<\/span>\n            <sc-if value=\"{{ ds.cn.hasDist }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 13px; color: #0B6B57; font-weight: 700\">Voc\u00ea est\u00e1 a {{ ds.cn.dist }} m deste ponto<\/span><\/sc-if>\n          <\/span>\n          <button type=\"button\" onClick=\"{{ ds.cn.clear }}\" style=\"border: 0; background: transparent; color: #0057A8; font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px\">Trocar<\/button>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n\n    <div style=\"background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n      <span style=\"font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; color: #0A2E5C\">Hor\u00e1rios<\/span>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n          <label for=\"ds-ini\" style=\"font-weight: 700; font-size: 14px; color: #0F1E2E\">In\u00edcio<\/label>\n          <input id=\"ds-ini\" type=\"time\" value=\"{{ ds.cn.ini }}\" onChange=\"{{ ds.cn.setIni }}\" style=\"height: 54px; border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 0 12px; font-size: 20px; font-weight: 700; background: #F8FAFC; min-width: 0; font-variant-numeric: tabular-nums\" />\n          <button type=\"button\" onClick=\"{{ ds.cn.iniNow }}\" style=\"height: 38px; border: 1.5px solid #C7D4E2; border-radius: 12px; background: #FFFFFF; color: #0057A8; font-weight: 700; font-size: 14px; cursor: pointer\">Usar hora atual<\/button>\n        <\/div>\n        <div style=\"display: flex; flex-direction: column; gap: 6px; min-width: 0\">\n          <label for=\"ds-fim\" style=\"font-weight: 700; font-size: 14px; color: #0F1E2E\">Fim<\/label>\n          <input id=\"ds-fim\" type=\"time\" value=\"{{ ds.cn.fim }}\" onChange=\"{{ ds.cn.setFim }}\" style=\"height: 54px; border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 0 12px; font-size: 20px; font-weight: 700; background: #F8FAFC; min-width: 0; font-variant-numeric: tabular-nums\" />\n          <button type=\"button\" onClick=\"{{ ds.cn.fimNow }}\" style=\"height: 38px; border: 1.5px solid #C7D4E2; border-radius: 12px; background: #FFFFFF; color: #0057A8; font-weight: 700; font-size: 14px; cursor: pointer\">Usar hora atual<\/button>\n        <\/div>\n      <\/div>\n      <sc-if value=\"{{ ds.cn.hasDur }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #0A2E5C; color: #FF nt-size: 17px; background: #FFFFFF; color: #0F1E2E; width: 100%; box-sizing: border-box\"/>\n    <span style=\"font-size: 13px; color: #52627A; margin-top: -6px\">Pelo menos 8 caracteres.<\/span>\n    <label for=\"pf-conf\" style=\"font-weight: 700; font-size: 14px; color: #0A2E5C\">Confirme a nova senha<\/label>\n    <input id=\"pf-conf\" type=\"password\" autocomplete=\"new-password\" style=\"height: 50px; border: 1.5px solid #C7D4E2; border-radius: 14px; padding: 0 14px; font-size: 17px; background: #FFFFFF; color: #0F1E2E; width: 100%; box-sizing: border-box\"/>\n    <div style=\"display: flex; gap: 10px; margin-top: 4px\"><button type=\"button\" onClick=\"{{ opFecharSenha }}\" disabled=\"{{ opTrocandoSenha }}\" style=\"flex: 1; height: 50px; border: 1.5px solid #C7D4E2; border-radius: 14px; background: #FFFFFF; color: #0A2E5C; font-size: 16px; font-weight: 700; cursor: pointer\">Cancelar<\/button><button type=\"button\" onClick=\"{{ opAlterarSenha }}\" disabled=\"{{ opTrocandoSenha }}\" style=\"flex: 1.4; height: 50px; border: 0; border-radius: 14px; background: #0057A8; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer\">{{ opSenhaTxt }}<\/button><\/div>\n  <\/div><\/sc-if>\n  <button type=\"button\" onClick=\"{{ nav.login }}\" style=\"height: 54px; border: 1.5px solid #C7D4E2; border-radius: 18px; background: #FFFFFF; color: #0A2E5C; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px\">\n    <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 4h4v16h-4\"/><path d=\"M10 8l-4 4 4 4\"/><path d=\"M6 12h10\"/><\/svg>\n    Sair da conta\n  <\/button>\n<\/div>\n<\/sc-if>\n\n\n\n<\/div>\n", cls: (function (DCLogic) {
class Component extends DCLogic {
  constructor(props) {

    this.state = {

  }

  colAddrs() {
    return [
      { addr: 'Rua São Paulo, 450', bairro: 'Centro', sys: 'eta' },
      { addr: 'Rua Rio de Janeiro, 1020', bairro: 'Centro', sys: 'eta' },
      { addr: 'Av. Domingos Camerlingo Caló, 2300', bairro: 'Vila Margarida', sys: 'eta' },

    return {

  }

  coletaVals(st, base, now) {
    const A = this.colAddrs(), SYS = this.colSys();
    const sysOf = (k) => SYS.find((x) => x.k === k);
    const filled = (v) => String(v == null ? '' : v).trim() !== '';
    const dec = (s) => { const t = String(s || '').trim(); if (!t) return NaN; return Number(t.replace(',', '.')); };
    const FIELDS = ['fl', 'ph', 'cor', 'tur', 'ct', 'cte'];
    const nFilled = (c) => FIELDS.filter((f) => filled(c[f])).length;
    const scr = st.screen;
    const set = (o) => () => this.setState(o);
    const cnReset = { loc: -1, gps: 'idle', q: '', cl: '', obs: '', dist: 0 };

    // ---- metas
    const wait = {}; SYS.forEach((s) => { wait[s.k] = 0; });
    st.colPend.forEach((c) => { wait[A[c.a].sys] += 1; });
    let tMeta = 0, tDone = 0, tWait = 0;
    const metas = SYS.map((s) => {
      const d = st.colDone[s.k], w = wait[s.k], falta = Math.max(0, s.meta - d);
      tMeta += s.meta; tDone += d; tWait += w;
      const pctD = Math.min(100, d / s.meta * 100);
      return {
        name: s.name, txt: d + ' de ' + s.meta,
        pctD: pctD.toFixed(1), pctW: Math.min(100 - pctD, w / s.meta * 100).toFixed(1),
        sub: falta === 0 ? 'Meta do mês concluída' : 'Faltam ' + falta + (w ? ', ' + w + (w === 1 ? ' aguardando análises' : ' aguardando análises') : ''),
        subC: falta === 0 ? '#0B6B57' : '#52627A'
      };
    });
    const tPctD = Math.min(100, tDone / tMeta * 100);

    // ---- pendentes
    const pend = st.colPend.map((c) => {
      const ad = A[c.a], n = nFilled(c);
      return {
        addr: ad.addr, where: ad.bairro + ', ' + sysOf(ad.sys).name,
        when: 'Coletada em ' + c.date + ' às ' + c.time + ', por ' + c.who,

        open: () => this.setState({ screen: 'coletaAn', anId: c.id, an: Object.assign({}, c), colMsg: '' })
      };
    });

    // ---- nova coleta
    const cn = st.cn;
    const putCn = (o) => this.setState({ cn: Object.assign({}, this.state.cn, o) });
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const q = norm(cn.q.trim());
    const searching = cn.loc < 0 && q.length >= 2;
    const results = !searching ? [] : A.map((x, i) => ({ x, i }))
      .filter((o) => norm(o.x.addr + ' ' + o.x.bairro).indexOf(q) >= 0).slice(0, 5)
      .map((o) => ({ addr: o.x.addr, sub: o.x.bairro + ', ' + sysOf(o.x.sys).name, pick: () => putCn({ loc: o.i, q: '', gps: 'idle', dist: 0 }) }));
    const sel = cn.loc >= 0 ? A[cn.loc] : null;

      : { txt: 'Dentro da faixa', bg: '#E2F4EE', fg: '#0B6B57' };
    const canSave = !!sel && isFinite(clV);

    // ---- análises da coleta
    const an = st.an || {};
    const putAn = (o) => this.setState({ an: Object.assign({}, this.state.an, o) });

    const rng = (v, lo, hi, txt) => !isFinite(v) ? { txt: 'Faixa: ' + txt, bg: '#EEF3F7', fg: '#52627A' }
      : (v < lo || v > hi) ? { txt: 'Fora da faixa (' + txt + ')', bg: '#FDF0DC', fg: '#8A3C06' }

    const NUMS = [

    }));
    const bools = [{ k: 'ct', lab: 'Coliformes totais' }, { k: 'cte', lab: 'Coliformes termotolerantes' }].map((b) => {

        lab: b.lab, isA: v === 'A', isP: v === 'P',

        pBd: v === 'P' ? '#B42318' : '#E8B7B2', pBg: v === 'P' ? '#B42318' : '#FFFFFF', pFg: v === 'P' ? '#FFFFFF' : '#8C1D18',
        setA: () => putAn({ [b.k]: 'A' }), setP: () => putAn({ [b.k]: 'P' })
      };
    });
    const anN = nFilled(an);
    const txtCol = (v) => (v === 'A' ? 'Ausente' : v === 'P' ? 'Presente' : '—');

    // ---- integração com o resto do app
    base.s.coleta = scr === 'coleta';
    base.s.coletaNova = scr === 'coletaNova';
    base.s.coletaAn = scr === 'coletaAn';

    if (st.okCtx === 'coleta') {
      base.hasNext = false;

    const tp = seg(st.colTab === 'pend'), tm = seg(st.colTab === 'metas');

    return {
      col: {
        tMeta, tDone, tWait, tFalta: Math.max(0, tMeta - tDone),

        homeSub: (tMeta - tDone) + ' faltam no mês, ' + tWait + ' aguardando análises',

          conclude: () => {

            ];

              last: { title: 'Análises concluídas', sub: anAd.addr + ', ' + sysOf(anAd.sys).name, rows }

    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  descVals(st, base) {
    const PTS = this.dscPoints();
    const SYSN = { eta: 'Sistema ETA', sj: 'Sistema São João', mor: 'Sistema Moradas', pac: 'Sistema Pacaembu' };
    const FLOW = { 50: 18, 75: 36, 100: 60, 150: 130 };
    const fmt = (n) => Math.round(n).toLocaleString('pt-BR');
    const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; };
    const durTxt = (m) => (m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min' : m + ' min');
    const where = (p) => PTS[p][1] + ', ' + SYSN[PTS[p][2]];
    const volOf = (p, min) => FLOW[PTS[p][3]] * min / 60;
    const flowTxt = (p) => 'Vazão estimada do ponto: ' + FLOW[PTS[p][3]] + ' m³/h (rede DN ' + PTS[p][3] + ').';
    const scr = st.screen;
    const dnReset = { loc: -1, gps: 'idle', q: '', ini: '', fim: '', obs: '', dist: 0 };
    const putDn = (o) => this.setState({ dn: Object.assign({}, this.state.dn, o) });
    const nowM = toMin(this.dscClock(0));

    // ---- hub
    const run = st.dscRun.map((r) => {
      let since = nowM - toMin(r.ini); if (since < 0) since += 1440;
      return {
        addr: PTS[r.p][0], where: where(r.p), when: 'Iniciada às ' + r.ini + ' por ' + r.who, since: durTxt(since),
        open: () => this.setState({ screen: 'descargaFim', dfId: r.id, dfFim: '' })
      };
    });
    const today = st.dscToday.map((d) => {
      const m = toMin(d.fim) - toMin(d.ini);
      return { addr: PTS[d.p][0], span: d.ini + ' às ' + d.fim + ', ' + durTxt(m), who: d.who, vol: fmt(volOf(d.p, m)) };
    });

    // ---- nova descarga
    const dn = st.dn;
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const q = norm(dn.q.trim());
    const searching = dn.loc < 0 && q.length >= 2;
    const results = !searching ? [] : PTS.map((x, i) => ({ x, i }))
      .filter((o) => norm(o.x[0] + ' ' + o.x[1]).indexOf(q) >= 0).slice(0, 5)
      .map((o) => ({ addr: o.x[0], sub: where(o.i) + ', DN ' + o.x[3], pick: () => putDn({ loc: o.i, q: '', gps: 'idle', dist: 0 }) }));
    const sel = dn.loc >= 0 ? PTS[dn.loc] : null;
    const iM = toMin(dn.ini), fM = toMin(dn.fim);
    const hasIni = isFinite(iM), hasFim = isFinite(fM);
    const err = hasIni && hasFim && fM <= iM;
    const dur = hasIni && hasFim && !err ? fM - iM : NaN;
    const okNew = !!sel && hasIni && hasFim && !err;
    const finished = okNew && hasFim;

    // ---- encerrar
    const rr = st.dscRun.find((r) => r.id === st.dfId) || st.dscRun[0] || { p: 0, ini: '', who: '' };
    const efI = toMin(rr.ini), efF = toMin(st.dfFim);
    const efErr = isFinite(efF) && efF <= efI;
    const efDur = isFinite(efF) && !efErr ? efF - efI : NaN;
    const efOk = isFinite(efDur);

    // ---- integração
    base.s.descarga = scr === 'descarga';
    base.s.descargaNova = scr === 'descargaNova';
    base.s.descargaFim = scr === 'descargaFim';
    base.s.nav = base.s.nav || scr === 'descarga';
    // Descargas de rede: o bloco abre direto uma descarga nova.
    base.nav.descarga = () => this.setState({ screen: 'descargaNova', dn: Object.assign({}, dnReset) });
    base.nav.descargaNova = () => this.setState({ screen: 'descargaNova', dn: Object.assign({}, dnReset) });
    if (st.acc.descarga) base.accChips = base.accChips.concat(['Descargas de rede']);
    if (st.okCtx === 'descarga') {
      base.hasNext = false;
      base.backLabel = 'Voltar para o início';
      base.on.backList = () => this.setState({ screen: 'home' });
    }
    const pushHist = (title, sub, t) => [{ title, sub, time: 'Hoje, ' + t, t }].concat(st.colHist);

    return {
      ds: {
        mN: st.dscMonthN, mVol: fmt(st.dscMonthVol),
        homeSub: '≈ ' + fmt(st.dscMonthVol) + ' m³ no mês' + (st.dscRun.length ? ', ' + st.dscRun.length + ' em andamento' : ''),
        run, hasRun: run.length > 0, today, todayEmpty: today.length === 0,
        cn: {
          noSel: !sel, hasSel: !!sel, busy: dn.gps === 'busy',
          gpsTxt: dn.gps === 'busy' ? 'Buscando sua localização…' : 'Usar minha localização',
          useGps: () => {
            putDn({ gps: 'busy' });
            setTimeout(() => { this.setState({ dn: Object.assign({}, this.state.dn, { gps: 'ok', loc: 1, dist: 35, q: '' }) }); }, 1100);
          },
          q: dn.q, setQ: (ev) => putDn({ q: ev.target.value }),
          results, listBd: results.length ? '1px solid #DDE5EE' : '0',
          noRes: searching && results.length === 0, hint: dn.loc < 0 && q.length < 2,
          addr: sel ? sel[0] : '', sub: sel ? where(dn.loc) + ', DN ' + sel[3] : '',
          hasDist: !!sel && dn.gps === 'ok', dist: dn.dist,
          clear: () => putDn({ loc: -1, gps: 'idle', dist: 0 }),
          ini: dn.ini, fim: dn.fim,
          setIni: (ev) => putDn({ ini: ev.target.value }), setFim: (ev) => putDn({ fim: ev.target.value }),
          iniNow: () => putDn({ ini: this.dscClock(0) }), fimNow: () => putDn({ fim: this.dscClock(0) }),
          hasDur: isFinite(dur) && !!sel, dur: isFinite(dur) ? durTxt(dur) : '', vol: isFinite(dur) && sel ? fmt(volOf(dn.loc, dur)) : '',
          flowTxt: sel ? flowTxt(dn.loc) : '', err, longWarn: isFinite(dur) && dur > 60,
          obs: dn.obs, setObs: (ev) => putDn({ obs: ev.target.value }),
          off: !okNew, op: okNew ? 1 : 0.45,
          btn: 'Registrar descarga',
          saveHint: !sel ? 'Escolha o ponto de descarga.' : !hasIni ? 'Informe o horário de início.' : !hasFim ? 'Informe o horário de fim.' : err ? 'Corrija os horários.' : 'Operador, data e horários são registrados ao salvar.',
          save: () => {
            if (!okNew) return;
            const a = sel[0];
            if (finished) {
              const v = volOf(dn.loc, dur);
              this.setState({
                dscToday: [{ p: dn.loc, ini: dn.ini, fim: dn.fim, who: (window.DB ? DB.operador() : 'Operador') }].concat(st.dscToday),
                dscMonthN: st.dscMonthN + 1, dscMonthVol: st.dscMonthVol + v, dn: Object.assign({}, dnReset),
                colHist: pushHist(a, 'Descarga de rede', dn.fim),
                screen: 'ok', okCtx: 'descarga',
                last: { title: 'Descarga registrada', sub: a, rows: [
                  { k: 'Início e fim', v: dn.ini + ' às ' + dn.fim }, { k: 'Duração', v: durTxt(dur) },
                  { k: 'Volume estimado', v: '≈ ' + fmt(v) + ' m³' }, { k: 'Sistema', v: SYSN[sel[2]] }
                ] }
              });
            } else {
              this.setState({
                dscRun: st.dscRun.concat([{ id: 'd' + st.dscSeq, p: dn.loc, ini: dn.ini, who: (window.DB ? DB.operador() : 'Operador') }]), dscSeq: st.dscSeq + 1,
                dn: Object.assign({}, dnReset), colHist: pushHist(a, 'Início de descarga', dn.ini),
                screen: 'ok', okCtx: 'descarga',
                last: { title: 'Descarga em andamento', sub: a, rows: [
                  { k: 'Início', v: dn.ini }, { k: 'Fim', v: 'Encerre em Descargas de rede' }, { k: 'Sistema', v: SYSN[sel[2]] }
                ] }
              });
            }
          }
        },
        ef: {
          addr: PTS[rr.p][0], where: where(rr.p) + ', DN ' + PTS[rr.p][3], who: rr.who, ini: rr.ini,
          fim: st.dfFim, setFim: (ev) => this.setState({ dfFim: ev.target.value }), now: () => this.setState({ dfFim: this.dscClock(0) }),
          hasDur: efOk, dur: efOk ? durTxt(efDur) : '', vol: efOk ? fmt(volOf(rr.p, efDur)) : '', flowTxt: flowTxt(rr.p),
          err: efErr, off: !efOk, op: efOk ? 1 : 0.45,
          save: () => {
            if (!efOk) return;
            const v = volOf(rr.p, efDur);
            this.setState({
              dscRun: st.dscRun.filter((r) => r.id !== rr.id),
              dscToday: [{ p: rr.p, ini: rr.ini, fim: st.dfFim, who: rr.who }].concat(st.dscToday),
              dscMonthN: st.dscMonthN + 1, dscMonthVol: st.dscMonthVol + v,
              colHist: pushHist(PTS[rr.p][0], 'Descarga de rede encerrada', st.dfFim),
              screen: 'ok', okCtx: 'descarga',
              last: { title: 'Descarga encerrada', sub: PTS[rr.p][0], rows: [
                { k: 'Início e fim', v: rr.ini + ' às ' + st.dfFim }, { k: 'Duração', v: durTxt(efDur) },
                { k: 'Volume estimado', v: '≈ ' + fmt(v) + ' m³' }
              ] }
            });
          }
        }
      }
    };
  }

  renderVals() {
    const st = this.state;
    const set = (o) => () => this.setState(o);
    const fmt = (n) => Math.round(n).toLocaleString('pt-BR');
    const fmt1 = (n) => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const num = (s) => { const t = String(s || '').trim(); if (!t) return NaN; return Number(t.replace(/\./g, '').replace(',', '.')); };
    const dec = (s) => { const t = String(s || '').trim(); if (!t) return NaN; return Number(t.replace(',', '.')); };
    const filled = (s) => String(s || '').trim() !== '';
    const now = new Date().toTimeString().slice(0, 5);

    const MAC = [
      'REL Paineiras', 'Entrada RAP Paineiras 2', 'Saída RAP Paineiras 2', 'Poço Diamantes',
      'RAP Cohab', 'REL Cohab', 'REL São João', 'Poço São João', 'Poço Pacaembu',
      'RAP Pacaembu - Zona Alta', 'RAP Pacaembu - Zona Baixa', 'Poço Moradas',
      'REL Moradas - Condomínio', 'REL Moradas - Bairros', 'REL Moradas Clube', 'Poço Ville de France',
      'R3 > São Silvestre', 'REL São Silvestre', 'Recalque Vila Margarida', 'REL Parque Minas Gerais',
      'REL Anchieta', 'Poço Nova Alcântara', 'RAP Nova Alcântara - Zona Baixa', 'REL Nova Alcântara - Zona Alta'
    ];
    const EMAC = [
      'Poço Esmeralda', 'Retrolavagem ETA 1', 'R2 > Centro', 'R2 > Parque Minas Gerais', 'Captação ETA 2',
      'Retrolavagem ETA 2', 'Saída ETA 2', 'R2 > Paineiras', 'R2 > Anchieta', 'Captação ETA 1'
    ];
    const mk = (name, i, grp) => {
      const poco = grp === 'poco' && name.indexOf('Poço') === 0;
      const semVaz = ['Poço Diamantes', 'Poço Nova Alcântara', 'RAP Nova Alcântara - Zona Baixa', 'REL Nova Alcântara - Zona Alta'].indexOf(name) >= 0;
      const oQue = semVaz ? 'totalizador' : 'vazão e totalizador';
      const sub = grp === 'eta' ? 'Macromedidor da ETA: ' + oQue
        : poco ? 'Poço: ' + oQue
        : (name.indexOf('Recalque') === 0 ? 'Recalque: ' + oQue : 'Reservatório: ' + oQue);
      const j = grp === 'eta' ? i + 40 : i;
      return {
        id: (grp === 'eta' ? 'e' : 'm') + i, name, poco, grp, sub,
        prev: 180000 + ((j * 7919 * 131) % 3900000),
        vazPrev: 25 + ((j * 37) % 50) + 0.4,
        who: j % 2 ? 'Rafael' : 'Ana',
        h: 23.8 + (j % 6) * 0.08
      };
    };
    const PTS = MAC.map((n, i) => mk(n, i, 'poco'));
    const EPTS = EMAC.map((n, i) => mk(n, i, 'eta'));
    const ALL = PTS.concat(EPTS);
    const ETES = ['ETE Choso Misato', 'ETE Moradas', 'ETE Moradas Clube', 'ETE Pacaembu', 'ETE Ville de France', 'ETE Trianon'];
    // Análise diária: cada ETE tem um dia fixo da semana (domingo não tem).
    const DIA_ETE = { 1: 'ETE Ville de France', 2: 'ETE Choso Misato', 3: 'ETE Moradas', 4: 'ETE Moradas Clube', 5: 'ETE Pacaembu', 6: 'ETE Trianon' };
    const DIAS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
    const ETA_OPTS = [
      { k: 'cal', name: 'Calibrações/Aferições de Equipamentos', sub: 'Turbidímetro, colorímetro e pHmetro' },
      { k: 'mac', name: 'Leitura de Macromedidores', sub: '10 macromedidores: vazão e totalizador' },
      { k: 'est', name: 'Estoque de Produtos Químicos', sub: 'PAC, flúor e sal, por turno' },
      { k: 'aq', name: 'Análises Quinzenais', sub: 'Água bruta e água tratada' },
      { k: 'desc', name: 'Descarregamento de Produtos Químicos', sub: 'Registre cada carga recebida' }
    ];

    const chipOf = (t) => ({ status: t ? 'Lançado às ' + t : 'Pendente', chipBg: t ? '#E2F4EE' : '#FDF0DC', chipFg: t ? '#0B6B57' : '#8A3C06' });
    const reset = { tot: '', vaz: '', cl: '', fl: '', foto: false, hip: '', aci: '', totTocado: false, ajCl: false, ajFl: false, clAnt: '', clNov: '', flAnt: '', flNov: '' };
    const openPoint = (id) => this.setState(Object.assign({ screen: 'poco', sel: id, tab: 'leitura' }, reset));
    const openEta = (k) => this.setState({ screen: 'eta', block: 'eta', etaMode: k, etaFilt: 'pend' });
    const openEst = (id) => this.setState(Object.assign({ screen: 'poco', block: 'pocoEst', sel: id, tab: 'estoque' }, reset));
    const openAn = (id) => this.setState(Object.assign({ screen: 'poco', block: 'pocoAn', sel: id, tab: 'analise' }, reset));
    const PD_VAZIA = { tipo: '', qtd: '', dest: '' };
    const openPocos = (k) => (k === 'mac' ? this.setState({ screen: 'lista', block: 'poco', filt: 'pend', q: '' })
      : k === 'est' ? this.setState({ screen: 'lista', block: 'pocoEst', filt: 'pend', q: '' })
      : k === 'an' ? this.setState({ screen: 'lista', block: 'pocoAn', filt: 'pend', q: '' })
      : k === 'niv' ? openForm('niv')
      : this.setState({ screen: 'pocoDesc', block: 'pocos', pd: [Object.assign({}, PD_VAZIA)] }));
    const openEte = (n) => this.setState({ screen: 'ete', block: 'eteChk', selEte: n, chk: {}, chkObs: {}, eteVaz: '' });
    // Formulários de análises e medições (sem pendência, exceto a análise diária das ETEs).
    const openForm = (k) => this.setState({ screen: 'form', formK: k, fxv: {}, fxLq: {}, anv: {}, fxObs: '', dqoTocado: false, fxEte: k === 'ad' ? (DIA_ETE[new Date().getDay()] || '') : '' });

    const etaMacItems = EPTS.map((p) => Object.assign({ id: p.id, name: p.name, t: st.done[p.id], pick: () => openPoint(p.id) }, chipOf(st.done[p.id])));
    const emDone = etaMacItems.filter((x) => x.t).length;
    const etaItems = ETA_OPTS.map((o) => {
      const base = { id: o.k, name: o.name, sub: o.sub, pick: () => (o.k === 'aq' ? openForm('aq') : openEta(o.k)) };
      if (o.k === 'mac') {
        const all = emDone === EPTS.length;
        return Object.assign(base, { t: all ? now : undefined, status: emDone + ' de ' + EPTS.length + ' lançados', chipBg: all ? '#E2F4EE' : '#FDF0DC', chipFg: all ? '#0B6B57' : '#8A3C06' });
      }
      if (o.k === 'desc' || o.k === 'aq') {
        return Object.assign(base, { noCount: true, t: undefined, status: '', chipBg: '#EEF3F7', chipFg: '#52627A' });
      }
      return Object.assign(base, { t: st.etaDone[o.k] }, chipOf(st.etaDone[o.k]));
    });

    // Poços: quatro opções (macros, análises por poço, estoque por poço e descarregamento).
    const POCO_OPTS = [
      { k: 'mac', name: 'Leitura de Macromedidores', sub: 'Poços, reservatórios e recalque: vazão e totalizador' },
      { k: 'an', name: 'Análises dos Poços', sub: 'Cloro, flúor e ajuste das bombas dosadoras' },

    const POCOS_EST = PTS.filter((x) => x.poco).concat(EPTS.filter((x) => x.name.indexOf('Poço') === 0));
    { // Poço Esmeralda antes do Poço Nova Alcântara
      const iN = POCOS_EST.findIndex((x) => x.name === 'Poço Nova Alcântara'), iE = POCOS_EST.findIndex((x) => x.name === 'Poço Esmeralda');

    // Nova Alcântara (poço e reservatórios): não é lido todo dia; opcional, não conta como pendente.
    const OPCIONAL = { m21: true, m22: true, m23: true };
    const chipOpc = (id, t) => (OPCIONAL[id] && !t ? { status: 'Opcional', chipBg: '#EEF3F7', chipFg: '#52627A', noCount: true } : Object.assign(chipOf(t), { noCount: !!OPCIONAL[id] }));
    const PTS_DIA = PTS.filter((x) => !OPCIONAL[x.id]), POCOS_DIA = POCOS_EST.filter((x) => !OPCIONAL[x.id]);
    const pmDone = PTS_DIA.filter((x) => st.done[x.id]).length;

    const paDone = POCOS_DIA.filter((x) => (st.anDone || {})[x.id]).length;
    const pocoItems = POCO_OPTS.map((o) => {

      if (o.k === 'desc' || o.k === 'niv') return Object.assign(base, { noCount: true, t: undefined, status: '', chipBg: '#EEF3F7', chipFg: '#52627A' });

      const tot = o.k === 'mac' ? PTS_DIA.length : o.k === 'an' ? POCOS_DIA.length : POCOS_EST.length, d = o.k === 'mac' ? pmDone : o.k === 'an' ? paDone : peDone, all = d === tot;
      return Object.assign(base, { t: all ? now : undefined, status: d + ' de ' + tot + ' lançados', chipBg: all ? '#E2F4EE' : '#FDF0DC', chipFg: all ? '#0B6B57' : '#8A3C06' });
    });
    // ETEs: Checklist (todas as ETEs, todo dia), Análises Diárias (uma ETE por dia, menos domingo) e Análises Mensais.
    const ecDone = ETES.filter((n) => st.eteDone[n]).length, ecAll = ecDone === ETES.length;
    const adHoje = st.adDone || null, domingo = new Date().getDay() === 0;
    const eteItems = [
      { id: 'chk', name: 'Checklist', sub: 'Vazão e checklist de cada ETE', pick: () => this.setState({ screen: 'lista', block: 'eteChk', filt: 'pend', q: '' }),
        t: ecAll ? now : undefined, status: ecDone + ' de ' + ETES.length + ' lançados', chipBg: ecAll ? '#E2F4EE' : '#FDF0DC', chipFg: ecAll ? '#0B6B57' : '#8A3C06' },
      Object.assign({ id: 'ad', name: 'Análises Diárias', sub: 'pH, temperatura, OD, sólidos e DQO de uma ETE por dia', pick: () => openForm('ad'), t: adHoje ? adHoje.t : undefined },
        adHoje ? { status: 'Lançada às ' + adHoje.t + ' (' + adHoje.ete.replace('ETE ', '') + ')', chipBg: '#E2F4EE', chipFg: '#0B6B57' }
          : domingo ? { noCount: true, status: 'Sem análise aos domingos', chipBg: '#EEF3F7', chipFg: '#52627A' } : chipOf(undefined)),
      { id: 'am', name: 'Análises Mensais', sub: 'Fósforo, nitrato, nitrito, nitrogênio, sulfato e sulfeto', pick: () => openForm('am'), noCount: true, t: undefined, status: '', chipBg: '#EEF3F7', chipFg: '#52627A' }
    ];
    const B = {
      pocos: { title: 'Poços', sub: 'Escolha o tipo de lançamento', items: pocoItems },
      pocoAn: { title: 'Análises dos Poços', sub: 'Poços', items: POCOS_EST.map((x) => Object.assign({ id: x.id, name: x.name, sub: 'Cloro, flúor e dosadoras', t: (st.anDone || {})[x.id], pick: () => openAn(x.id) }, chipOpc(x.id, (st.anDone || {})[x.id]))) },
      pocoEst: { title: 'Estoque de Produtos Químicos', sub: 'Poços', items: POCOS_EST.map((x) => Object.assign({ id: x.id, name: x.name, sub: 'Hipoclorito e ácido fluossilícico', t: (st.estDone || {})[x.id], pick: () => openEst(x.id) }, (st.estDone || {})[x.id] ? chipOf((st.estDone || {})[x.id]) : { status: '', chipBg: '', chipFg: '' })) },
      poco: { title: 'Leitura de Macromedidores', sub: 'Poços, reservatórios e recalque', items: PTS.map((p) => Object.assign({ id: p.id, name: p.name, sub: p.sub, t: st.done[p.id], pick: () => { this.setState({ block: 'poco' }); openPoint(p.id); } }, chipOpc(p.id, st.done[p.id]))) },

      ete: { title: 'ETEs', sub: 'Escolha o tipo de lançamento', items: eteItems },
      eteChk: { title: 'Checklist', sub: 'ETEs', items: ETES.map((n) => Object.assign({ id: n, name: n, sub: 'Vazão e checklist', t: st.eteDone[n], pick: () => openEte(n) }, chipOf(st.eteDone[n]))) }
    };
    const stat = (k) => { const it = B[k].items.filter((x) => !x.noCount); const d = it.filter((x) => x.t).length; return { done: d, total: it.length, pend: it.length - d, pct: Math.round(d / it.length * 100) }; };
    const bk = { poco: stat('poco'), eta: stat('eta'), ete: stat('ete') };
    const keys = ['eta', 'ete', 'poco'].filter((k) => st.acc[k]);
    const allDone = keys.reduce((s, k) => s + bk[k].done, 0);
    const allTotal = keys.reduce((s, k) => s + bk[k].total, 0);

    const cbk = B[st.block];
    const q = st.q.trim().toLowerCase();
    const shown = cbk.items.filter((x) => (st.filt === 'ok' ? !!x.t : !x.t) && (!q || x.name.toLowerCase().indexOf(q) >= 0));

    // ---- formulário de macromedidor
    const p = ALL.find((x) => x.id === st.sel) || PTS[0];
    const cur = num(st.tot);
    const hasCur = isFinite(cur) && cur > 0;
    const vazV = dec(st.vaz);
    const hasVaz = isFinite(vazV) && vazV >= 0;
    const vol = cur - p.prev;
    const neg = hasCur && vol < 0;
    const hh = Math.floor(p.h);
    const mm = Math.round((p.h - hh) * 60);
    const opt = (on) => ({ bd: on ? '#0057A8' : '#DDE5EE', bg: on ? '#E3EEF9' : '#FFFFFF', fg: on ? '#0057A8' : '#0A2E5C' });
    const band = (v, lo, hi, loTxt, hiTxt) => {
      if (!isFinite(v)) return { txt: 'Faixa: ' + loTxt + ' a ' + hiTxt + ' mg/L', bg: '#EEF3F7', fg: '#52627A' };
      if (v < lo) return { txt: 'Abaixo da faixa', bg: '#FDF0DC', fg: '#8A3C06' };
      if (v > hi) return { txt: 'Acima da faixa', bg: '#FDF0DC', fg: '#8A3C06' };
      return { txt: 'Dentro da faixa', bg: '#E2F4EE', fg: '#0B6B57' };
    };
    const clS = band(dec(st.cl), 0.2, 2.0, '0,2', '2,0');
    // Análises do poço: cloro e flúor; o ajuste de cada dosadora é informado só quando foi feito.
    const anVal = (v) => isFinite(dec(v)) && dec(v) >= 0 && String(v).trim() !== '';
    const ajOk = (on, a, n) => !on || (anVal(a) && anVal(n));
    const anTem = anVal(st.cl) && anVal(st.fl);
    const canSaveAn = anTem && ajOk(st.ajCl, st.clAnt, st.clNov) && ajOk(st.ajFl, st.flAnt, st.flNov);
    const aj = (k, on, ant, nov) => {
      const cS = opt(on), cN = opt(!on);
      return { simOn: !!on, naoOn: !on, simBd: cS.bd, simBg: cS.bg, simFg: cS.fg, naoBd: cN.bd, naoBg: cN.bg, naoFg: cN.fg,
        sim: () => this.setState({ ['aj' + k]: true }), nao: () => this.setState({ ['aj' + k]: false }),
        ant, nov, setAnt: (e) => this.setState({ [k.toLowerCase() + 'Ant']: e.target.value }), setNov: (e) => this.setState({ [k.toLowerCase() + 'Nov']: e.target.value }) };
    };
    const flS = band(dec(st.fl), 0.6, 0.8, '0,6', '0,8');
    const tank = (v, cap, perDay) => {
      const n = dec(v);
      const pct = isFinite(n) ? Math.max(0, Math.min(100, Math.round(n / cap * 100))) : 0;
      return { pct, col: pct < 20 ? '#D97706' : '#0091BF', dias: isFinite(n) ? Math.floor(n / perDay) : 0 };
    };
    // Capacidade de cada poço (definida em Produtos químicos, no computador); sem cadastro, 1.000 L e 500 L.
    const capP = Object.assign({ hip: 1000, aci: 500 }, (st.capPocos || {})[p.id] || {});
    // Sem valor digitado, o tanque mostra o último estoque (cor e texto mais fracos), como na ETA.
    const ultEst = (st.estUlt || {})[p.id] || null;
    const descP = (st.pdDesde || {})[p.id] || {};
    const tanque = (v, cap, perDay, ant, descarregou, nomeProd) => {
      const n = dec(v), tem = isFinite(n);
      const base = tem ? n : (ant != null ? Number(ant) : NaN);
      const pct = isFinite(base) ? Math.max(0, Math.min(100, Math.round(base / cap * 100))) : 0;
      // Volume maior que o último estoque só com descarregamento depois desse registro.
      const acima = tem && ant != null && n > Number(ant) && !descarregou;
      return {
        pct, col: !tem ? '#B8C6D6' : pct < 20 ? '#D97706' : '#0091BF', txtCor: tem ? '#0A2E5C' : '#8A9BB0',
        dias: isFinite(base) ? Math.floor(base / perDay) : 0, acima, bd: acima ? '#B42318' : '#C7D4E2',
        acimaTxt: acima ? 'Maior que o último estoque (' + fmt(Number(ant)) + ' L). Só é possível com descarregamento de ' + nomeProd + ' registrado depois desse estoque.' : ''
      };
    };
    const hipT = tanque(st.hip, capP.hip, 58, ultEst && ultEst.hip, descP.hip, 'hipoclorito');
    const aciT = tanque(st.aci, capP.aci, 21, ultEst && ultEst.aci, descP.aci, 'ácido');
    const estPocoOk = isFinite(dec(st.hip)) && isFinite(dec(st.aci)) && !hipT.acima && !aciT.acima;
    // Pontos sem medidor de vazão instantânea: só o totalizador.
    const SEM_VAZAO = ['Poço Diamantes', 'Poço Nova Alcântara', 'RAP Nova Alcântara - Zona Baixa', 'REL Nova Alcântara - Zona Alta'];
    const temVazao = SEM_VAZAO.indexOf(p.name) < 0;
    const canSave = hasCur && (hasVaz || !temVazao);

    // ---- calibrações da ETA
    const EQUIP = [
      { name: 'Turbidímetro', fields: [
        { k: 't20', lab: '20 NTU' }, { k: 't100', lab: '100 NTU' },
        { k: 't800', lab: '800 NTU', opt: true, hint: 'Use só se a turbidez da água bruta estiver acima de 100 NTU.' },
        { k: 't10', lab: '10 NTU' }] },
      { name: 'Colorímetro', fields: [
        { k: 'c500', lab: '500 Pt-Co', opt: true, hint: 'Use só se a cor da água bruta estiver acima de 100 Pt-Co.' },

      { name: 'pHmetro', fields: [

    ];
    let calReqTotal = 0, calReqDone = 0;
    const calEquip = EQUIP.map((e) => {

      return {

    const calOk = calReqDone === calReqTotal;

    // ---- estoque de produtos químicos (litros por reservatório)
    const GROUPS = [
      { k: 'pac1', name: 'PAC ETA 1', res: [['R1', 22000, 14200], ['R2', 22000, 9800], ['R3', 30000, 21500]] },

      { k: 'flu1', name: 'Flúor ETA 1', res: [['R1', 1000, 640], ['R2', 1000, 520], ['R3', 1000, 410], ['R4', 1000, 180]] },

    const stockGroups = GROUPS.map((g) => {

          pct, col: !has ? '#C7D4E2' : pct < 20 ? '#D97706' : '#0091BF', over, bd: over ? '#D97706' : '#C7D4E2',
          set: (ev) => this.setState({ lev: Object.assign({}, st.lev, { [key]: ev.target.value }) })
        };
      });
      const gp = Math.round(sum / cap * 100);
      return { name: g.name, res, totTxt: fmt(sum) + ' de ' + fmt(cap) + ' L (' + gp + '%)' + (any ? '' : ', último registro'), totC: gp < 20 ? '#8A3C06' : '#52627A', sum };
    });

    // Estoque da ETA: só registra com todos os reservatórios (e os sacos de sal) preenchidos e dentro da capacidade.
    const estOk = stockGroups.every((g) => g.res.every((r) => !r.vazio && !r.excede)) && isFinite(num(st.salUsed));

    // ---- descarregamento
    const prods = ['PAC', 'Flúor', 'Sal'].map((n) => ({
      name: n, on: st.prod === n,
      bd: st.prod === n ? '#0057A8' : '#DDE5EE', bg: st.prod === n ? '#E3EEF9' : '#FFFFFF', fg: st.prod === n ? '#0057A8' : '#0A2E5C',

    }));
    const descEtas = ['ETA 1', 'ETA 2'].map((n) => ({

    const kg = num(st.descKg);

    const descConv = !st.prod || !hasKg ? '' : st.prod === 'Sal' ? 'Equivale a ' + fmt(kg / 25) + ' sacos de 25 kg' : 'Equivale a cerca de ' + fmt(kg / DENS[st.prod]) + ' L (densidade ' + String(DENS[st.prod]).replace('.', ',') + ')';
    const descOk = !!st.prod && !!st.descEta && hasKg;

    // ---- ETE
    const CHK = [
      { k: 'grades', name: 'Limpeza das grades' },
      { k: 'elev', name: 'Elevatória' },
      { k: 'sopr', name: 'Sopradores' },
      { k: 'reciclo', name: 'Reciclo de lodo' },
      { k: 'areia', name: 'Limpeza da caixa de areia' },
      { k: 'dist', name: 'Limpeza da caixa de distribuição' }
    ];
    const chkItems = CHK.map((c) => {
      const v = st.chk[c.k];
      return {

        ncBg: v === 'nc' ? '#B45309' : '#FFFFFF', ncFg: v === 'nc' ? '#FFFFFF' : '#9A4508', ncBd: v === 'nc' ? '#B45309' : '#E8C9A5',

        setObs: (ev) => this.setState({ chkObs: Object.assign({}, st.chkObs, { [c.k]: ev.target.value }) })

    const ncMissing = CHK.filter((c) => st.chk[c.k] === 'nc' && !filled(st.chkObs[c.k])).length;
    const ncN = CHK.filter((c) => st.chk[c.k] === 'nc').length;
    const vazMissing = !filled(st.eteVaz);
    const eteOk = !vazMissing && chkDone === CHK.length && ncMissing === 0;
    const eteHint = vazMissing ? 'Anote a vazão da ETE em m³/h.'
      : chkDone < CHK.length ? 'Marque OK ou NC em todos os itens do checklist.'
      : ncMissing ? 'Explique cada item marcado como NC.'
      : 'Data, hora e operador são registrados ao salvar.';
    const yn = (on) => ({ bd: on ? '#0057A8' : '#DDE5EE', bg: on ? '#E3EEF9' : '#FFFFFF', fg: on ? '#0057A8' : '#0A2E5C' });
    const aY = yn(st.anal === true), aN = yn(st.anal === false);
    const an = {
      yes: st.anal === true, no: st.anal === false,
      setYes: set({ anal: true }), setNo: set({ anal: false }),
      yBd: aY.bd, yBg: aY.bg, yFg: aY.fg, nBd: aN.bd, nBg: aN.bg, nFg: aN.fg,
      note: st.anal === true ? 'Preencha as análises completas abaixo.' : st.anal === false ? 'A visita será registrada só com vazão e checklist.' : 'As análises completas são feitas uma vez por semana em cada ETE.'
    };
    const two = 'repeat(2, minmax(0, 1fr))', three = 'repeat(3, minmax(0, 1fr))';
    const pair = (id, name) => ({ name, cols: two, fields: [{ id: id + '-b', lab: 'Bruto' }, { id: id + '-t', lab: 'Tratado' }] });
    const eteAn = [
      pair('an-ph', 'pH'),
      pair('an-temp', 'Temperatura (°C)'),
      pair('an-od', 'OD (mg/L)'),
      pair('an-sol', 'Sólidos sedimentáveis (mL/L)'),
      { name: 'DQO (mg/L)', cols: three, fields: [{ id: 'an-dqo-p', lab: 'Padrão' }, { id: 'an-dqo-b', lab: 'Bruto' }, { id: 'an-dqo-t', lab: 'Tratado' }] }
    ];
    eteAn.forEach((g) => {
      g.fields.forEach((fl) => {
        fl.val = (st.anv || {})[fl.id] || '';
        fl.set = (ev) => this.setState({ anv: Object.assign({}, this.state.anv, { [fl.id]: ev.target.value }) });
      });
      const pd = dec((st.anv || {})['an-dqo-p']);
      const dd = isFinite(pd) ? Math.abs(pd - 500) / 500 * 100 : 0;
      g.alerta = g.name.indexOf('DQO') === 0 && isFinite(pd) && dd > 10;
      g.alertaTxt = 'Padrão com desvio de ' + Math.round(dd) + '% em relação a 500 mg/L. A análise de DQO está comprometida: o recomendado é refazer o padrão.';
    });

    // ---- histórico
    const hist = [];
    Object.keys(st.done).forEach((id) => { const pt = ALL.find((x) => x.id === id); hist.push({ title: pt.name, sub: pt.grp === 'eta' ? 'Macromedidor da ETA' : 'Leitura de macromedidor', time: 'Hoje, ' + st.done[id], t: st.done[id] }); });
    Object.keys(st.etaDone).forEach((k) => { const o = ETA_OPTS.find((x) => x.k === k); hist.push({ title: o.name, sub: 'ETAs', time: 'Hoje, ' + st.etaDone[k], t: st.etaDone[k] }); });
    Object.keys(st.eteDone).forEach((n) => hist.push({ title: n, sub: 'Checklist', time: 'Hoje, ' + st.eteDone[n], t: st.eteDone[n] }));
    if (st.adDone) hist.push({ title: st.adDone.ete, sub: 'Análise diária', time: 'Hoje, ' + st.adDone.t, t: st.adDone.t });
    hist.sort((a, b) => (a.t < b.t ? 1 : -1));

    // ---- navegação
    const isEtaMac = st.okCtx === 'etamac';
    const nextItem = isEtaMac ? etaMacItems.find((x) => !x.t) : cbk.items.find((x) => !x.t && !x.noCount);
    const scr = st.screen;

(function () {

    if (!name || !PAGES[name] || (window.DB && !DB.podeAbrir(name, cel))) name = inicio;
